# guard-loop-signal-k37 — keep `cargo test` from killing the session it was
# typed into.
#
# This repo is a **meta-grove**: its own test suite *is* the loop machinery, and
# this grove is still driven by installed v22 binaries and skills. Its live session's
# environment carries `GROVE_SIGNAL_FILE` — the path the loop driver watches, and
# whose mere appearance makes it SIGTERM the harness child (self-driving-loop).
# Authority to end a session is therefore ambient: every descendant of the
# session inherits it, `cargo test` included. The suite's fake harnesses do
# `: > "$GROVE_SIGNAL_FILE"`, so any harness spawn that does not scope the
# variable writes the *live* path and kills the developer's terminal.
#
# Force-clear it for everything cargo runs. Empty is deliberately stronger than
# redirecting to an inert path: the installed v22 `grove-llm` treats every nonempty signal path
# as session-epoch authority and validates it before tree access. This is the
# half that cannot be forgotten — it applies whether or not a test remembers to
# scrub, and to tests that do not use the shared helpers at all. `testing/support.rs`
# (`LOOP_CONTROL_ENV`) carries the in-process and subprocess half; the two are
# deliberately independent, because a test binary executed directly rather than
# through cargo gets only the latter.
#
# Dispatch and Ravel sessions carry inherited exit authority, while Grove
# lifecycle sessions also carry a launch directory for epoch admission. Clear
# both contexts, retired channels/PID handles and dispatch's old run/store
# identity so nested tests cannot end, impersonate or borrow an enclosing session.
#
# Scope note: this also applies to `cargo run -- …` in this repo. The current
# CLI has no `complete` verb. Follow the live session's original launch prompt:
# this grove uses `harness-dispatch exit`, directly and never through cargo.
# A retired installed-v22 complete channel remains cleared for compatibility.
[env]
GROVE_SIGNAL_FILE = { value = "", force = true }
GROVE_RUN_SIGNAL_FILE = { value = "", force = true }
# Old/new exit authority and session identity stop at the cargo boundary.
HARNESS_DISPATCH_EXIT_FILE = { value = "", force = true }
GROVE_LAUNCH_DIR = { value = "", force = true }
HARNESS_DISPATCH_RUN_ID = { value = "", force = true }
HARNESS_DISPATCH_STATE_DIR = { value = "", force = true }
RAVEL_EXIT_FILE = { value = "", force = true }
GROVE_HARNESS_PID = { value = "", force = true }
GROVE_CLAUDE_PID = { value = "", force = true }
