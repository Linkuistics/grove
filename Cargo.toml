# grove is a cargo workspace: the root `grove` package (CLI) plus the
# extractable `harness-pane` crate (the in-process-pty terminal embed,
# ADR-0014). The root package is itself an implicit workspace member, so
# `cargo build`/`cargo test` from here covers both.
[workspace]
members = ["crates/harness-pane"]
# `crates/trellis` is grove's hard fork of zellij (ADR-0020), itself a complete
# cargo workspace with its own `Cargo.lock`. It is **excluded** so a host
# `cargo build`/`cargo test` never folds its ~100k-LOC member crates into grove's
# build *as workspace members*; the one-way grove→trellis seam is an
# unconditional path dependency *into* it (see the `trellis` dependency below).
exclude = ["crates/trellis"]

[package]
name = "grove"
version = "6.1.0"
edition = "2021"
description = "Hierarchical, self-extending workstream tool for AI agents"
license = "Apache-2.0"
repository = "https://github.com/Linkuistics/grove"
rust-version = "1.74"

# Sibling git worktrees live alongside the crate root but aren't part
# of the crate. `.grove-meta/` carries inbox files whose ISO-8601 names
# contain `:` (rejected by `cargo package` as not Windows-portable),
# and `.grove-worktrees/` holds active grove worktrees.
exclude = [".grove-meta", ".grove-worktrees"]

[[bin]]
name = "grove"
path = "src/main.rs"

# Second binary: the verbs the LLM driving a grove invokes mid-session.
# Audience-split per ADR-0006 — the human's `grove --help` shows none of
# these. Shares all internal logic with `grove` via the [lib] below.
[[bin]]
name = "grove-llm"
path = "src/bin/grove-llm.rs"

[lib]
name = "grove"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
flate2 = "1.0"
# `poll(2)` on the proxy's (socket, stdin) fds so a single-threaded relay loop
# stops reading stdin while an `$EDITOR` child owns the tty (ADR-0017). Already
# in the tree transitively; declared here for the proxy's direct use.
libc = "0.2"
notify = "6"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# SIGWINCH detection in the dumb dashboard proxy (`grove __dash-proxy`,
# ADR-0016). The proxy forwards *raw* stdin up to the controller rather than
# using crossterm's event reader, so it needs an independent resize-signal path.
# Already in the tree transitively (via crossterm); declared here for the proxy.
signal-hook = "0.3"
sha2 = "0.10"
tar = "0.4"
tempfile = "3.10"
thiserror = "1.0"
# Parse the fleet manifest (`~/.config/grove/fleet.toml`) — the user-facing,
# hand-edited config listing explicit `repos` and `scan_roots` for the
# multi-repo fleet view (ADR-0025, leaf 070/010). Below the presentation
# boundary; the manifest is a plain, walk-away-legible artifact.
toml = "0.8"
ureq = { version = "2.10", features = ["json"] }

# The grove→trellis framework seam (ADR-0020/0021). `trellis` is grove's hard fork
# of zellij, vendored at `crates/trellis/` (its own workspace). grove may depend on
# trellis; trellis must **never** depend on grove (one-way).
#
# These deps are **unconditional**: trellis is the one, always-on TUI (ADR-0026).
# Per ADR-0021's library-you-link decision grove owns `main` and dispatches the
# trellis client/server roles itself, so it links all three foundational crates —
# `zellij-client` (the foreground client UI / blitter), `zellij-server` (the
# re-exec'd render daemon), and `zellij-utils` (shared config/layout/data). The
# package aliases keep grove's references reading as `trellis*` rather than
# `zellij_*`. The earlier `trellis-seam` feature gate (which kept these optional
# while the native host API was built out) was removed: it defaulted *off*, so the
# shipped binary linked no trellis and `grove tui` fell into a fleet-blind local
# dashboard — the bug ADR-0026 fixes. The cost is a slower default build (the heavy
# ~100k-LOC server link: terminal emulation, PTY, the wasmi plugin host), accepted
# for one coherent always-trellis binary.
trellis = { package = "zellij-utils", path = "crates/trellis/zellij-utils" }
trellis-client = { package = "zellij-client", path = "crates/trellis/zellij-client" }
trellis-server = { package = "zellij-server", path = "crates/trellis/zellij-server" }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
