[package]
name = "grove"
version = "1.0.0"
edition = "2021"
description = "Hierarchical, self-extending workstream tool for AI agents"
license = "MIT"
repository = "https://github.com/Linkuistics/grove"
rust-version = "1.74"

[[bin]]
name = "grove"
path = "src/main.rs"

[lib]
name = "grove"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
flate2 = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tar = "0.4"
thiserror = "1.0"
ureq = { version = "2.10", features = ["json"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
