# **The workspace root is not a package.** It was `grove` until
# `loop-crate-driver-k22`, which moved the last of `src/` into
# `crates/grove-loop` and gave the human-facing binary its own crate at
# `crates/grove`. What is left here is the workspace itself: its members, the one
# release version they all wear, and the lint gate they all inherit.
#
# `crates/grove` is the human's binary — bare `grove`, the loop's entry point —
# and `crates/grove-llm` is the session's. Both are **crates rather than
# `[[bin]]` targets inside a library**, and that is the point: a binary target
# can reach its own library's private items, so *the binary is thin* stops being
# compiler-enforced the moment it is a target rather than a crate
# (`docs/specs/module-decomposition.md`, decision 1).
#
# `crates/grove-loop` is grove's loop (decision 9): the task tree in grove's own
# vocabulary, the twelve verbs a session invokes over it, and — since this leaf —
# the driver, its lease, the prompt it composes and the launch configuration it
# reads. It is the one library crate allowed to be domain-bound.
#
# `crates/ordinal-fs-tree` is the tree library grove's own tree modules were
# extracted into (gh issue #13); grove's side of that is a domain implementation
# of one seam, and its algebra is gone. Its design documents stay at
# `docs/ordinal-fs-tree/` rather than moving under the crate: `docs/adr/` is flat
# and repo-wide, and four artifacts link into that path.
#
# `crates/jj-workspace` is the VCS seam (decision 8): resolve a jj workspace,
# refuse a working tree that is not one, take a path-scoped commit. It is
# domain-free down to the method — `control_dir` takes the consumer's namespace
# rather than knowing grove's name — and it is the only thing in this workspace
# that spawns `jj`.
#
# `crates/keyed-launch` is the runner (decision 7): a configuration of
# `key -> complete command template`, validated whole against a slot vocabulary
# supplied at load, expanded into an argv, spawned directly and supervised. It is
# domain-free down to the noun — it says *key*, never *session kind*.
#
# `resolver = "2"` is stated rather than inherited. A workspace root that is not
# a package has no package edition to take a resolver from, so this line is now
# load-bearing rather than a restatement of what 2021 implies.
[workspace]
members = [
    "crates/book-validation",
    "crates/grove",
    "crates/grove-llm",
    "crates/grove-loop",
    "crates/jj-workspace",
    "crates/keyed-launch",
    "crates/ordinal-fs-tree",
]
resolver = "2"

# `.grove-worktrees/` holds active grove worktrees — whole checkouts of this
# repository, each with its own `crates/`. Excluded so a stray manifest under
# one can never be mistaken for a member of *this* workspace.
exclude = [".grove-worktrees"]

# **One workspace, one release version** (`docs/specs/module-decomposition.md`,
# decision 1), and since `loop-crate-driver-k22` that is a fact about the
# manifests rather than a convention: every member takes `version.workspace =
# true`, so there is exactly one place a version can be written and no way for
# two members to disagree. `cargo release` cuts `crates/grove` — the binary the
# tag names and an operator installs — and bumping it rewrites the field below,
# which every member reads.
#
# That is what makes `grove_loop::VERSION` answerable at all. The prompt
# publishes grove's release version (decision 10) and the loop composes the
# prompt, so the constant has to be readable from `crates/grove-loop`; with a
# per-package version it would have answered `0.1.0`, which names nothing an
# operator can install.
[workspace.package]
version = "20.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Linkuistics/grove"
# Minimum supported Rust version — the floor the locked graph actually builds on.
# Edition-2024 dependencies (`clap` 4.6, `clap_lex` 1.1, `assert_cmd` 2.2) set
# it: cargo below 1.85 cannot parse their manifests, so a build dies during
# dependency resolution before compiling any Grove code. Nothing else tests this
# claim — there is no CI, and an ordinary build never checks its own
# `rust-version` — so it is established by running the toolchains, and
# `msrv-claim-k74` found the previous `1.74` had silently drifted into being
# unbuildable:
#
#   rustup run 1.85 cargo check --locked --all-targets   # passes
#   rustup run 1.84 cargo check --locked --all-targets   # fails: edition 2024
#
# Re-run that pair after any `cargo update` that moves an edition-2024 pin.
# Nothing holds a lower promise: `release.toml` sets `publish = false` (not a
# crates.io crate) and the Homebrew formula installs prebuilt archives, so no
# consumer compiles Grove. Pinning `clap` back to edition 2021 to preserve 1.74
# would have bought nothing and needed re-litigating at every update.
rust-version = "1.85"

# Hold the clippy baseline at zero, for every member. `clippy-baseline-k4` cleared
# eight warnings that had accumulated unnoticed, and a baseline with nothing
# defending it just climbs back — an ordinary `cargo build` or `cargo test` never
# mentions a clippy lint, so the count is invisible between deliberate audits.
# This repo has no CI (see the `rust-version` note above), so the manifest is the
# only place a gate can live; there is no workflow step to put one in.
#
# Denying the group costs ordinary builds nothing: rustc does not evaluate
# `clippy::` tool lints, so `cargo build` and `cargo test` are unaffected and
# this bites only under `cargo clippy` — exactly when it should. Run
# `cargo clippy --workspace --all-targets` before committing, where a new
# warning is now an error rather than a line of scrollback.
#
# `--workspace` is no longer load-bearing the way it was — this root is not a
# package any more, so a bare `cargo clippy` from here already covers every
# member — but it is still what `docs/RELEASING.md` and the leaf bodies name,
# and it is the invocation that cannot become narrower by accident.
#
# `priority = -1` keeps the group from outranking a future single-lint override
# placed beside it.
#
# These live at the workspace rather than in each package so a new member
# inherits the baseline by writing `[lints] workspace = true` and cannot start
# below it by omission — the failure mode of the per-package form, where the
# gate is a thing each crate has to remember.
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[workspace.lints.rust]
# Suppressions in this workspace prefer `#[expect(...)]` over `#[allow(...)]`
# wherever the justification could stop holding — an enum whose variant-size
# ratio is a fact about today's types, say. An expectation only expires loudly
# if going stale is itself an error;
# left at the default `warn` it would be swallowed by the same inattention this
# table exists to prevent. Permanent suppressions (portability, say) stay
# `#[allow]`.
unfulfilled_lint_expectations = "deny"
