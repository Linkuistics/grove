[package]
name = "grove"
version = "18.4.0"
edition = "2021"
description = "Hierarchical, self-extending workstream tool for AI agents"
license = "Apache-2.0"
repository = "https://github.com/Linkuistics/grove"
# Minimum supported Rust version — the floor the locked graph actually builds on.
# Edition-2024 dependencies (`clap` 4.6, `clap_lex` 1.1, `assert_cmd` 2.2) set
# it: cargo below 1.85 cannot parse their manifests, so a build dies during
# dependency resolution before compiling any Grove code. Nothing else tests this
# claim — there is no CI, and an ordinary build never checks its own
# `rust-version` — so it is established by running the toolchains, and
# `msrv-claim-k74` found the previous `1.74` had silently drifted into being
# unbuildable:
#
#   rustup run 1.85 cargo check --locked --all-targets   # passes
#   rustup run 1.84 cargo check --locked --all-targets   # fails: edition 2024
#
# Re-run that pair after any `cargo update` that moves an edition-2024 pin.
# Nothing holds a lower promise: `release.toml` sets `publish = false` (not a
# crates.io crate) and the Homebrew formula installs prebuilt archives, so no
# consumer compiles Grove. Pinning `clap` back to edition 2021 to preserve 1.74
# would have bought nothing and needed re-litigating at every update.
rust-version = "1.85"

# Sibling git worktrees live alongside the crate root but aren't part
# of the crate: `.grove-worktrees/` holds active grove worktrees.
exclude = [".grove-worktrees"]

[[bin]]
name = "grove"
path = "src/main.rs"

# Second binary: the verbs the LLM driving a grove invokes mid-session.
# Audience-split per cli-binary-split — the human's `grove --help` shows none of
# these. Shares all internal logic with `grove` via the [lib] below.
[[bin]]
name = "grove-llm"
path = "src/bin/grove-llm.rs"

[lib]
name = "grove"
path = "src/lib.rs"

# Hold the clippy baseline at zero. `clippy-baseline-k4` cleared eight warnings
# that had accumulated unnoticed, and a baseline with nothing defending it just
# climbs back — an ordinary `cargo build` or `cargo test` never mentions a clippy
# lint, so the count is invisible between deliberate audits. This repo has no CI
# (see the `rust-version` note above), so the manifest is the only place a gate
# can live; there is no workflow step to put one in.
#
# Denying the group costs ordinary builds nothing: rustc does not evaluate
# `clippy::` tool lints, so `cargo build` and `cargo test` are unaffected and
# this bites only under `cargo clippy` — exactly when it should. Run
# `cargo clippy --all-targets` before committing, where a new warning is now an
# error rather than a line of scrollback.
#
# `priority = -1` keeps the group from outranking a future single-lint override
# placed beside it.
[lints.clippy]
all = { level = "deny", priority = -1 }

[lints.rust]
# Suppressions here prefer `#[expect(...)]` over `#[allow(...)]` wherever the
# justification could stop holding — see the finish-transaction enums in
# `src/repo/finish_commit.rs`, whose size ratio is a fact about today's types.
# An expectation only expires loudly if going stale is itself an error; left at
# the default `warn` it would be swallowed by the same inattention this table
# exists to prevent. Permanent suppressions (portability, say) stay `#[allow]`.
unfulfilled_lint_expectations = "deny"

# No `[build-dependencies]`. `build.rs` is a `std`-only `rerun-if-changed` walk
# over `content/`: it emits one hint per file so an edit reaches the embed, and
# does nothing else. It used to `#[path]`-include the crate's own unit-marker
# parser (and, through `src/leaf.rs`, `anyhow`) to gate the embed on that
# grammar; the markers are gone, and what the gate bought is asserted over the
# embed in `tests/methodology.rs`. It does not hash `content/` either — both
# binaries link the embed and compute the methodology identity from it directly.

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
# Embed the full `content/` methodology tree into the `grove` binary at compile
# time (self-extension-core-and-methodology / task-tree-scheme). Bare `grove`
# extracts this embed to the global personal skill dir
# (`~/.claude/skills/grove/`), so the skill can never drift from the binary —
# replacing the old fetch-tarball + materialise + `VERSION.md` model, now
# deleted. Paired with `build.rs`, which emits
# `rerun-if-changed` for every content file: on stable Rust the macro does not
# register its reads with Cargo, so an edit would otherwise leave a stale embed.
include_dir = "0.7"
kdl = "4.7"
# Used by the self-driving loop substrate (self-driving-loop): `loop_driver.rs` ignores
# SIGINT (`libc::signal`) so the driver survives the human's Ctrl-C and checks
# `isatty` before launching, and its session watcher ends a signalled session
# with `libc::kill` (SIGTERM, then SIGKILL).
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
shell-words = "1.1"
tempfile = "3.10"

[dev-dependencies]
assert_cmd = "2.0"
tempfile = "3.10"
