# This repo is a **workspace** whose root package is still `grove`, and whose
# other members are the domain-free libraries grove is being decomposed into
# (`docs/specs/module-decomposition.md`).
#
# `crates/ordinal-fs-tree` is the tree library grove's own tree modules were
# extracted into (gh issue #13); grove's side of that is a domain implementation
# of one seam, and its algebra is gone. Its design documents stay at
# `docs/ordinal-fs-tree/` rather than moving under the crate: `docs/adr/` is flat
# and repo-wide while grove occupies the root, and four artifacts link into that
# path.
#
# `crates/jj-workspace` is the VCS seam (decision 8): resolve a jj workspace,
# refuse a working tree that is not one, take a path-scoped commit. It is
# domain-free down to the method — `control_dir` takes the consumer's namespace
# rather than knowing grove's name — and it is the only thing in this workspace
# that spawns `jj`.
#
# `crates/keyed-launch` is the runner's template half (decision 7): a configuration
# of `key -> complete command template`, validated whole against a slot vocabulary
# supplied at load, and expanded into an argv. It is domain-free down to the
# noun — it says *key*, never *session kind* — and it holds no set of keys, which
# is what let decision 6's completeness quantifier become per-key and
# just-in-time. The channel, the spawn and the escalation follow at
# `keyed-launch-run-k11`.
#
# `resolver = "2"` is stated rather than inherited. A workspace root that is also
# a package takes its resolver from that package's edition, so this is what 2021
# already implies — written down so a later edition bump cannot move it silently.
[workspace]
members = ["crates/jj-workspace", "crates/keyed-launch", "crates/ordinal-fs-tree"]
resolver = "2"

# Hold the clippy baseline at zero, for every member. `clippy-baseline-k4` cleared
# eight warnings that had accumulated unnoticed, and a baseline with nothing
# defending it just climbs back — an ordinary `cargo build` or `cargo test` never
# mentions a clippy lint, so the count is invisible between deliberate audits.
# This repo has no CI (see the `rust-version` note below), so the manifest is the
# only place a gate can live; there is no workflow step to put one in.
#
# Denying the group costs ordinary builds nothing: rustc does not evaluate
# `clippy::` tool lints, so `cargo build` and `cargo test` are unaffected and
# this bites only under `cargo clippy` — exactly when it should. Run
# `cargo clippy --workspace --all-targets` before committing, where a new
# warning is now an error rather than a line of scrollback.
#
# `--workspace` is load-bearing rather than belt-and-braces. This root is *also*
# a package, so a bare `cargo clippy` lints `grove` alone and every member
# crate's warnings go unread — which is how `crates/keyed-launch` came to carry
# two of them unnoticed between `keyed-launch-templates-k10` and
# `keyed-launch-run-k11`, with the baseline below in force the whole time.
#
# `priority = -1` keeps the group from outranking a future single-lint override
# placed beside it.
#
# These live at the workspace rather than in each package so a new member
# inherits the baseline by writing `[lints] workspace = true` and cannot start
# below it by omission — the failure mode of the per-package form, where the
# gate is a thing each crate has to remember.
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[workspace.lints.rust]
# Suppressions in this workspace prefer `#[expect(...)]` over `#[allow(...)]`
# wherever the justification could stop holding — an enum whose variant-size
# ratio is a fact about today's types, say. An expectation only expires loudly
# if going stale is itself an error;
# left at the default `warn` it would be swallowed by the same inattention this
# table exists to prevent. Permanent suppressions (portability, say) stay
# `#[allow]`.
unfulfilled_lint_expectations = "deny"

[package]
name = "grove"
version = "19.5.0"
edition = "2021"
description = "Hierarchical, self-extending workstream tool for AI agents"
license = "Apache-2.0"
repository = "https://github.com/Linkuistics/grove"
# Minimum supported Rust version — the floor the locked graph actually builds on.
# Edition-2024 dependencies (`clap` 4.6, `clap_lex` 1.1, `assert_cmd` 2.2) set
# it: cargo below 1.85 cannot parse their manifests, so a build dies during
# dependency resolution before compiling any Grove code. Nothing else tests this
# claim — there is no CI, and an ordinary build never checks its own
# `rust-version` — so it is established by running the toolchains, and
# `msrv-claim-k74` found the previous `1.74` had silently drifted into being
# unbuildable:
#
#   rustup run 1.85 cargo check --locked --all-targets   # passes
#   rustup run 1.84 cargo check --locked --all-targets   # fails: edition 2024
#
# Re-run that pair after any `cargo update` that moves an edition-2024 pin.
# Nothing holds a lower promise: `release.toml` sets `publish = false` (not a
# crates.io crate) and the Homebrew formula installs prebuilt archives, so no
# consumer compiles Grove. Pinning `clap` back to edition 2021 to preserve 1.74
# would have bought nothing and needed re-litigating at every update.
rust-version = "1.85"

# Sibling git worktrees live alongside the crate root but aren't part
# of the crate: `.grove-worktrees/` holds active grove worktrees.
exclude = [".grove-worktrees"]

[[bin]]
name = "grove"
path = "src/main.rs"

# Second binary: the verbs the LLM driving a grove invokes mid-session.
# Audience-split per cli-binary-split — the human's `grove --help` shows none of
# these. Shares all internal logic with `grove` via the [lib] below.
[[bin]]
name = "grove-llm"
path = "src/bin/grove-llm.rs"

[lib]
name = "grove"
path = "src/lib.rs"

# The clippy baseline and the `#[expect]` policy live in `[workspace.lints]` at
# the head of this file, so every member inherits one gate rather than each
# restating it.
[lints]
workspace = true

# **No `build.rs` at all**, and no `[build-dependencies]`. The script was a
# `std`-only `rerun-if-changed` walk over `content/`, emitting one hint per file
# so an edit reached the `include_dir!` embed that `include_dir` does not
# register with Cargo on stable. `delete-provisioning-k19` deleted `content/`,
# the embed and the module that carried it, so the walk had nothing left to
# re-run for and went with them.

[dependencies]
# **No `include_dir`, no `sha2`, and no production `tempfile`.** All three were
# provisioning's: `include_dir` embedded `content/`, `sha2` hashed the embed for
# the methodology identity the build-pairing report compared, and `tempfile`
# staged an extraction so a rename was the only thing to touch a live skill
# directory. `delete-provisioning-k19` deleted the sweep, so grove writes no
# skill directory and carries no corpus — the methodology installs as a plugin
# like every other skill this repo ships. `tempfile` survives below as a
# dev-dependency, which is all the fixtures ever needed it as.
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
# Used by the self-driving loop substrate (self-driving-loop): `loop_driver.rs` ignores
# SIGINT (`libc::signal`) so the driver survives the human's Ctrl-C and checks
# `isatty` before launching, and its session watcher ends a signalled session
# with `libc::kill` (SIGTERM, then SIGKILL).
libc = "0.2"
# The extracted tree library (gh issue #13). `default-features = false` turns off
# its `cli` feature, which exists for its own `syllabus` binary and pulls in
# `clap`: with it off, the dependency set this crate *imposes* on grove is
# exactly `libc`, which grove already takes for `flock` and the loop driver's
# signals. That claim is the point of the line rather than a note beside it, so
# `tests/library_dependency.rs` holds it against `cargo metadata` — the crate's
# own manifest says the set is `libc` and nothing but a test says grove asked for
# that set.
#
# Nothing consumes it yet: `src/task_name.rs` is Grove's `EntryName`
# implementation, written in the flip's *expand* stage before any verb moves onto
# the library.
# The VCS seam (`docs/specs/module-decomposition.md`, decision 8). It imposes no
# dependency of its own — its errors are an opaque `Refusal` implementing
# `std::error::Error`, which `anyhow` swallows through `?` without either crate
# knowing about the other.
jj-workspace = { path = "crates/jj-workspace" }
# The runner's template half (`docs/specs/module-decomposition.md`, decision 7).
# It imposes `kdl` and `shell-words` — the two document formats a template
# configuration is written in, both of which grove already depended on directly
# for the module this replaces.
keyed-launch = { path = "crates/keyed-launch" }
ordinal-fs-tree = { path = "crates/ordinal-fs-tree", default-features = false }

[dev-dependencies]
assert_cmd = "2.0"
tempfile = "3.10"
