# grove is a single-package cargo workspace (the root `grove` package / CLI).
# The TUI tower (rmux/ratatui app + Fleet) was deleted in leaf `080-shed-tui`
# (ADR-0031/0032), so the workspace has no extra members and gains none — grove's
# runtime is now the self-driving loop driver + the tree verbs.
[workspace]
members = []

[package]
name = "grove"
version = "6.3.0"
edition = "2021"
description = "Hierarchical, self-extending workstream tool for AI agents"
license = "Apache-2.0"
repository = "https://github.com/Linkuistics/grove"
rust-version = "1.74"

# Sibling git worktrees live alongside the crate root but aren't part
# of the crate. `.grove-meta/` carries inbox files whose ISO-8601 names
# contain `:` (rejected by `cargo package` as not Windows-portable),
# and `.grove-worktrees/` holds active grove worktrees.
exclude = [".grove-meta", ".grove-worktrees"]

[[bin]]
name = "grove"
path = "src/main.rs"

# Second binary: the verbs the LLM driving a grove invokes mid-session.
# Audience-split per ADR-0006 — the human's `grove --help` shows none of
# these. Shares all internal logic with `grove` via the [lib] below.
[[bin]]
name = "grove-llm"
path = "src/bin/grove-llm.rs"

[lib]
name = "grove"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
flate2 = "1.0"
# Embed the full `content/` methodology tree into the `grove` binary at compile
# time (ADR-0031/0034, leaf 070/010). `grove do` extracts this embed to the
# global personal skill dir (`~/.claude/skills/grove/`), so the skill can never
# drift from the binary — replacing the old fetch-tarball + materialise +
# `VERSION.md` model (whose deletion is 090). Paired with `build.rs`, which emits
# `rerun-if-changed` for every content file: on stable Rust the macro does not
# register its reads with Cargo, so an edit would otherwise leave a stale embed.
include_dir = "0.7"
# Used by the self-driving loop substrate (ADR-0032): `loop_driver.rs` ignores
# SIGINT (`libc::signal`) so the driver survives the human's Ctrl-C and checks
# `isatty` before launching, and the `grove-llm complete` signal verb's
# self-spawned delayed killer detaches via `libc::setsid`.
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
tempfile = "3.10"
thiserror = "1.0"
ureq = { version = "2.10", features = ["json"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
