# grove is a cargo workspace: the root `grove` package (CLI) plus the
# extractable `harness-pane` crate (the in-process-pty terminal embed,
# ADR-0014). The root package is itself an implicit workspace member, so
# `cargo build`/`cargo test` from here covers both.
#
# `crates/grove-nav` (the zellij WASM nav plugin, ADR-0018) is **excluded**: it
# only builds for `wasm32-wasip1` and depends on `zellij-tile`, so a host
# `cargo build`/`cargo test` must not try to compile it. The root `build.rs`
# builds it explicitly for wasm and embeds the result.
[workspace]
members = ["crates/harness-pane"]
# `crates/trellis` is grove's hard fork of zellij (ADR-0020), itself a complete
# cargo workspace with its own `Cargo.lock`. It is **excluded** so a host
# `cargo build`/`cargo test` never folds its ~100k-LOC member crates into grove's
# build; the one-way grove→trellis seam is a path dependency *into* it (see the
# optional `trellis` dependency + `trellis-seam` feature below). Same pattern as
# `crates/grove-nav`.
exclude = ["crates/grove-nav", "crates/trellis"]

[package]
name = "grove"
version = "5.1.0"
edition = "2021"
description = "Hierarchical, self-extending workstream tool for AI agents"
license = "Apache-2.0"
repository = "https://github.com/Linkuistics/grove"
rust-version = "1.74"
# Builds the grove-nav wasm plugin and embeds it (see build.rs, leaf 070).
build = "build.rs"

# Sibling git worktrees live alongside the crate root but aren't part
# of the crate. `.grove-meta/` carries inbox files whose ISO-8601 names
# contain `:` (rejected by `cargo package` as not Windows-portable),
# and `.grove-worktrees/` holds active grove worktrees.
exclude = [".grove-meta", ".grove-worktrees"]

[[bin]]
name = "grove"
path = "src/main.rs"

# Second binary: the verbs the LLM driving a grove invokes mid-session.
# Audience-split per ADR-0006 — the human's `grove --help` shows none of
# these. Shares all internal logic with `grove` via the [lib] below.
[[bin]]
name = "grove-llm"
path = "src/bin/grove-llm.rs"

[lib]
name = "grove"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
flate2 = "1.0"
# `poll(2)` on the proxy's (socket, stdin) fds so a single-threaded relay loop
# stops reading stdin while an `$EDITOR` child owns the tty (ADR-0017). Already
# in the tree transitively; declared here for the proxy's direct use.
libc = "0.2"
notify = "6"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# SIGWINCH detection in the dumb dashboard proxy (`grove __dash-proxy`,
# ADR-0016). The proxy forwards *raw* stdin up to the controller rather than
# using crossterm's event reader, so it needs an independent resize-signal path.
# Already in the tree transitively (via crossterm); declared here for the proxy.
signal-hook = "0.3"
sha2 = "0.10"
tar = "0.4"
tempfile = "3.10"
thiserror = "1.0"
ureq = { version = "2.10", features = ["json"] }

# The grove→trellis framework seam (ADR-0020). `trellis` is grove's hard fork of
# zellij, vendored at `crates/trellis/` (its own workspace). grove may depend on
# trellis; trellis must **never** depend on grove (one-way). Kept **optional**
# while the native host API is built out (leaves 020/110): a default
# `cargo build`/`cargo test` stays fast and unchanged, while
# `cargo build --features trellis-seam` proves the edge compiles. 110 makes the
# real in-process link non-optional. `zellij-utils` is the framework's
# foundational library crate; the seam will broaden as the host API lands.
trellis = { package = "zellij-utils", path = "crates/trellis/zellij-utils", optional = true }

[features]
# Compile the grove→trellis framework dependency (ADR-0020). Off by default; the
# native host API (110) will make it always-on.
trellis-seam = ["dep:trellis"]

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
