# grove is a single-package cargo workspace (the root `grove` package / CLI),
# plus one extra member: `codex-bridge`, the falsification harness for
# AgentAnyware's `success-demonstration-k11` grove (see that crate's own
# top-of-file doc comment). It is a separate crate deliberately — it shares
# no code with `grove`'s own `[lib]`, needs dependencies (`uuid`, `base64`,
# `serde_json`) the shipped `grove`/`grove-llm` binaries have no reason to
# carry, and staying un-depended-on by the `grove` package is what keeps it
# off `grove`'s shipped surface (D3 in that grove's `demo-architecture-and-
# plan-k53` leaf) without any packaging step having to know to exclude it.
# The TUI tower (rmux/ratatui app + Fleet) was deleted in leaf `080-shed-tui`
# (self-extension-core-and-methodology / self-driving-loop) — grove's own
# runtime is the self-driving loop driver + the tree verbs.
[workspace]
members = ["codex-bridge"]

[package]
name = "grove"
version = "11.0.0"
edition = "2021"
description = "Hierarchical, self-extending workstream tool for AI agents"
license = "Apache-2.0"
repository = "https://github.com/Linkuistics/grove"
rust-version = "1.74"

# Sibling git worktrees live alongside the crate root but aren't part
# of the crate: `.grove-worktrees/` holds active grove worktrees.
exclude = [".grove-worktrees"]

[[bin]]
name = "grove"
path = "src/main.rs"

# Second binary: the verbs the LLM driving a grove invokes mid-session.
# Audience-split per cli-binary-split — the human's `grove --help` shows none of
# these. Shares all internal logic with `grove` via the [lib] below.
[[bin]]
name = "grove-llm"
path = "src/bin/grove-llm.rs"

[lib]
name = "grove"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
# Embed the full `content/` methodology tree into the `grove` binary at compile
# time (self-extension-core-and-methodology / task-tree-scheme, leaf 070/010). `grove do` extracts this embed to the
# global personal skill dir (`~/.claude/skills/grove/`), so the skill can never
# drift from the binary — replacing the old fetch-tarball + materialise +
# `VERSION.md` model (deleted in 090). Paired with `build.rs`, which emits
# `rerun-if-changed` for every content file: on stable Rust the macro does not
# register its reads with Cargo, so an edit would otherwise leave a stale embed.
include_dir = "0.7"
# Used by the self-driving loop substrate (self-driving-loop): `loop_driver.rs` ignores
# SIGINT (`libc::signal`) so the driver survives the human's Ctrl-C and checks
# `isatty` before launching, and its session watcher ends a signalled session
# with `libc::kill` (SIGTERM, then SIGKILL).
libc = "0.2"
sha2 = "0.10"
tempfile = "3.10"
thiserror = "1.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
