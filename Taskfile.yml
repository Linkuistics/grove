version: '3'

set: [errexit, nounset, pipefail]

tasks:
  check:
    desc: Run the repository's reusable checks
    cmds:
      - bash scripts/check.sh

  # harness-dispatch: the Rust front and its Bun-compiled policy worker. The
  # worker builds only here, never from cargo; `crates/harness-dispatch/scripts/
  # dispatch.sh` owns the mechanics, and the front refuses a worker built from
  # other source, so a stale one fails tests loudly rather than passing them.
  dispatch:deps:
    desc: Install harness-dispatch's pinned development type checker
    dir: crates/harness-dispatch/worker
    cmds:
      - bun install --frozen-lockfile

  dispatch:worker:
    desc: Compile the harness-dispatch policy worker into target/libexec/harness-dispatch
    cmds:
      - task: dispatch:deps
      - bash crates/harness-dispatch/scripts/dispatch.sh build

  dispatch:typecheck:
    desc: Type-check the worker, the SDK and its fixtures against the built declarations
    cmds:
      - task: dispatch:worker
      - bash crates/harness-dispatch/scripts/dispatch.sh typecheck

  dispatch:build:
    desc: Build the harness-dispatch pair in this checkout
    cmds:
      - task: dispatch:worker
      - cargo build --locked -p harness-dispatch

  dispatch:check:
    desc: Run harness-dispatch's package checks against a freshly built worker
    cmds:
      - task: dispatch:typecheck
      - cargo test --locked -p harness-dispatch

  dispatch:install:
    desc: Install the harness-dispatch pair under PREFIX/bin and PREFIX/libexec (default ~/.local)
    vars:
      PREFIX: '{{.PREFIX | default (printf "%s/.local" .HOME)}}'
    cmds:
      - task: dispatch:deps
      - bash crates/harness-dispatch/scripts/dispatch.sh install "{{.PREFIX}}"

  design:harness-selection:
    desc: Serve the harness selection design at localhost (default port 8769)
    vars:
      PORT: '{{.PORT | default "8769"}}'
    cmds:
      - python3 -m http.server {{.PORT}} --bind 127.0.0.1 --directory docs/design/harness-selection-and-execution

  release:patch:
    desc: Publish and install the next patch release
    cmds:
      - task: release
        vars: {LEVEL: patch}

  release:minor:
    desc: Publish and install the next minor release
    cmds:
      - task: release
        vars: {LEVEL: minor}

  release:major:
    desc: Publish and install the next major release
    cmds:
      - task: release
        vars: {LEVEL: major}

  # Unreleased archives of the working copy, in the release layout, for the
  # installed-layout smoke tests. `task release:archives TARGETS=x86_64-unknown-linux-gnu`
  # builds one target; the default is every target.
  release:archives:
    desc: Build release archives of the working copy into target/archives, without a tag or publication
    cmds:
      - scripts/release-build.sh --unreleased {{.TARGETS}}

  # The installed-layout smoke test, rebuilding the archives first so it never
  # reads a stale one. `task release:smoke TARGETS=x86_64-unknown-linux-gnu`
  # tests one target; the default is every target. macOS arm64 runs natively,
  # and each Linux target in a glibc-2.17 userland under a pinned user-mode
  # QEMU emulating its CPU floor, Nehalem or Cortex-A53, after a native
  # container where Docker runs the architecture; that needs an arm64 Docker
  # and Zig (scripts/release-smoke.sh). The release runs the same script over
  # target/dist before publishing. Rerun it after any change to the worker, the
  # layout or native dependencies.
  release:smoke:
    desc: Build archives of the working copy and smoke-test each one's installed layout on its target
    cmds:
      - task: release:archives
        vars: {TARGETS: '{{.TARGETS}}'}
      - scripts/release-smoke.sh {{.TARGETS}}

  release:notes:
    desc: Refresh Unreleased notes from all changes since the last release, without publishing
    preconditions:
      - sh: test -d .jj
        msg: Run release notes from a jj workspace.
    cmds:
      - bash scripts/release-notes.sh

  release:
    internal: true
    requires:
      vars:
        - name: LEVEL
          enum: [patch, minor, major]
    preconditions:
      - sh: test -d .jj && test -d .git && test "$(pwd -P)" = "$(jj workspace root --name default)"
        msg: Run releases from Grove's default colocated jj workspace.
    # Commands are sequential. Never move these to deps, which run in parallel.
    cmds:
      - |
        mkdir .jj/release-lock || {
          echo 'Another release holds .jj/release-lock. If it was interrupted, confirm it has stopped before removing the lock.' >&2
          exit 1
        }
      - defer: rmdir .jj/release-lock
      - scripts/release-doctor.sh
      - bash scripts/release-prepare.sh
      - scripts/release-publish.sh --check-tap
      - bash scripts/check.sh
      - cargo release {{.LEVEL}}
      - cargo release {{.LEVEL}} --execute --no-confirm
      - jj bookmark set main -r "$(git rev-parse HEAD)"
      - scripts/release-build.sh
      # Nothing is published before this passes: each archive in target/dist
      # matches the manifest and runs its installed layout on its target at
      # the floors. A failure leaves the cut local; docs/RELEASING.md,
      # "If the installed smoke test fails", gives the recovery.
      - scripts/release-smoke.sh --archives target/dist
      - jj git push -b main
      - git push origin "$(git describe --tags --exact-match HEAD)"
      - scripts/release-publish.sh
      - brew update
      - |
        if brew list --versions grove >/dev/null 2>&1; then
          brew upgrade grove
        else
          brew install linkuistics/taps/grove
        fi
      - brew test grove
      - |
        tag="$(git describe --tags --exact-match HEAD)"
        version="${tag#v}"
        # The Homebrew prefix's commands, not whichever copy PATH finds first:
        # `task dispatch:install` puts one in ~/.local/bin by default.
        brew_bin="$(brew --prefix)/bin"
        test "$("$brew_bin/grove" --version)" = "grove $version"
        test "$("$brew_bin/grove-llm" --version)" = "grove-llm $version"
        test "$("$brew_bin/harness-dispatch" --version)" = "harness-dispatch $version"
        "$brew_bin/grove" view --help
        gh release view "$tag" --repo Linkuistics/grove --json url,assets
        test "$(gh release view "$tag" --repo Linkuistics/grove --json assets --jq '.assets | length')" = 3
