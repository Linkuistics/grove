version: '3'

set: [errexit, nounset, pipefail]

tasks:
  release:floor:qemu:
    desc: Prove actual separately admitted callers and backend refusals at both pinned QEMU floors
    requires:
      vars: [ARCHIVES, RAVEL_ARCHIVES]
    cmds:
      - bash scripts/release-floor-qemu.sh "{{.ARCHIVES}}" "{{.RAVEL_ARCHIVES}}" {{.TARGETS}}

  release:floor:qemu:prepare:
    desc: Prepare test-only host-native bubblewrap with its isolated glibc 2.17 dependency closure
    requires:
      vars: [OUT]
    cmds:
      - bash scripts/release-floor-qemu-backend.sh "{{.OUT}}"

  release:floor:qemu:controls:
    desc: Refuse unsupported QEMU targets and existing or aliased backend destinations
    cmds:
      - bash scripts/release-floor-qemu.test.sh

  release:floor:native:
    desc: Rebuild and prove real native arm64 confinement, publication and backend refusals at glibc 2.17
    requires:
      vars: [BACKENDS]
    cmds:
      - task: release:archives
        vars: {TARGETS: aarch64-unknown-linux-gnu}
      - task: release:floor:native:run
        vars: {BACKENDS: '{{.BACKENDS}}', ARCHIVES: target/archives, RAVEL_ARCHIVES: '{{.RAVEL_ARCHIVES}}'}

  release:floor:native:run:
    desc: Run native floor acceptance over explicit already-built archives (no QEMU or rebuild)
    requires:
      vars: [BACKENDS, ARCHIVES]
    cmds:
      - bash scripts/release-floor-native.sh "{{.BACKENDS}}" "{{.ARCHIVES}}" {{if .RAVEL_ARCHIVES}}"{{.RAVEL_ARCHIVES}}"{{end}}

  release:floor:seccomp:controls:
    desc: Check pinned native seccomp derivation and changed/missing source refusals
    cmds:
      - bash scripts/floor-seccomp.test.sh

  release:floor:prepare:
    desc: Build pinned test-only bubblewrap 0.11.0 for the exact Linux glibc floor
    requires:
      vars: [OUT]
    cmds:
      - bash scripts/release-floor-backend.sh "{{.OUT}}" {{.TARGETS}}

  release:floor:controls:
    desc: Refuse changed/missing backend inputs, wrong ELF and unsafe output destinations
    cmds:
      - bash scripts/release-floor-backend.test.sh
      - bash scripts/atomic-directory-publish.test.sh

  release:floor:probe:
    desc: Diagnose real backend execution and namespace availability at native/QEMU floors (not caller acceptance)
    requires:
      vars: [BACKENDS]
    cmds:
      - bash scripts/release-floor-backend-probe-host.sh "{{.BACKENDS}}"

  legacy:prepare:
    desc: Read and back up the complete original 22.1.0 keg without modifying installation or PATH
    requires:
      vars: [KEG, STABLE_BIN, OUT]
    cmds:
      - python3 scripts/legacy_driver_transition.py prepare --keg "{{.KEG}}" --stable-bin "{{.STABLE_BIN}}" --output "{{.OUT}}"

  legacy:apply:
    desc: Require cleanup suppression and create absent owned original-command PATH links
    requires:
      vars: [PLAN]
    cmds:
      - python3 scripts/legacy_driver_transition.py apply --plan "{{.PLAN}}"

  legacy:verify:
    desc: Verify complete original keg/backup bytes, cleanup suppression and inherited PATH resolution
    requires:
      vars: [PLAN]
    cmds:
      - python3 scripts/legacy_driver_transition.py verify --plan "{{.PLAN}}"

  legacy:cleanup:
    desc: Remove owned compatibility links only after the original driver is confirmed reaped
    requires:
      vars: [PLAN, DRIVER_ENDED]
    preconditions:
      - sh: test "{{.DRIVER_ENDED}}" = yes
        msg: Confirm the original driver and its sessions are reaped; never run before its last signal.
    cmds:
      - python3 scripts/legacy_driver_transition.py cleanup --plan "{{.PLAN}}" --driver-ended

  legacy:controls:
    desc: Run isolated complete-keg, link ownership, cleanup and refusal controls
    cmds:
      - python3 scripts/test_legacy_driver_transition.py

  legacy:rehearsal:
    desc: Rehearse scratch upgrade/unlink with the actual old front/worker and independent Ravel
    requires:
      vars: [KEG, RAVEL, OUT]
    cmds:
      - python3 scripts/legacy_driver_rehearsal.py --keg "{{.KEG}}" --ravel "{{.RAVEL}}" --output "{{.OUT}}"

  ravel:targets:prepare:
    desc: Fetch/validate pinned Ravel 1.0.0 archives and expose separate fresh target prefixes
    requires:
      vars: [OUT]
    cmds:
      - python3 scripts/ravel_target_inputs.py {{if .ARCHIVES}}--archives "{{.ARCHIVES}}"{{end}} --output "{{.OUT}}" {{.TARGETS}}

  ravel:targets:controls:
    desc: Check archive admission and real pinned-layout refusals without a host runtime
    requires:
      vars: [ARCHIVES]
    cmds:
      - python3 scripts/test_ravel_target_inputs.py
      - bash scripts/ravel-target-inputs.test.sh "{{.ARCHIVES}}"

  ravel:targets:smoke:
    desc: Run pinned separate Ravel layouts natively and at Linux glibc/CPU floors with fake agents
    cmds:
      - bash scripts/ravel-target-smoke.sh {{if .ARCHIVES}}--archives "{{.ARCHIVES}}"{{end}} {{.TARGETS}}

  ravel:review:
    desc: Check creator-aware Grove review assets, launch/retirement provenance
    requires:
      vars: [RAVEL]
    cmds:
      - task: ravel:provenance
        vars: {RAVEL: '{{.RAVEL}}'}

  ravel:provenance:
    desc: Check Grove-owned selected-provider evidence, retirement and inherited-evidence isolation
    requires:
      vars: [RAVEL]
    env:
      GROVE_TEST_RAVEL: '{{.RAVEL}}'
      GROVE_PROVIDER_EVIDENCE: /inert-enclosing-evidence
    cmds:
      - task: ravel:policy
        vars: {RAVEL: '{{.RAVEL}}'}
      - cargo nextest run --locked -p grove --test creator_lifecycle --test env_hygiene
      - cargo nextest run --locked -p grove -E 'test(enclosing_ravel_and_retired_controls)'
      - cargo nextest run --locked -p grove-llm --test composition_guidance
      - bash plugins/grove/conformance.sh

  ravel:policy:
    desc: Check Grove-readable static and review assets through the independent installed Ravel SDK and worker
    requires:
      vars: [RAVEL]
    cmds:
      - task: ravel:policy:typecheck
        vars: {RAVEL: '{{.RAVEL}}'}
      - task: ravel:policy:compiler-test
        vars: {RAVEL: '{{.RAVEL}}'}
      - task: ravel:policy:runtime
        vars: {RAVEL: '{{.RAVEL}}'}

  ravel:policy:deps:
    desc: Install Grove's pinned development compiler for its caller-owned policy assets
    dir: tools/ravel-policy
    cmds:
      - bun install --frozen-lockfile

  ravel:policy:compiler-test:
    desc: Prove public-SDK typechecking works without dispatch source and refuses invalid inputs
    requires:
      vars: [RAVEL]
    env:
      GROVE_TEST_RAVEL: '{{.RAVEL}}'
    cmds:
      - bash scripts/ravel-policy-typecheck.test.sh

  ravel:policy:typecheck:
    desc: Typecheck Grove policy assets and ordinary imports against installed Ravel declarations
    requires:
      vars: [RAVEL]
    cmds:
      - task: ravel:policy:deps
      - bash scripts/ravel-policy-typecheck.sh "{{.RAVEL}}"

  ravel:policy:runtime:
    desc: Run Grove-readable policies through copied installed Ravel with fake agents and isolated PATH
    requires:
      vars: [RAVEL]
    env:
      GROVE_TEST_RAVEL: '{{.RAVEL}}'
    cmds:
      - cargo nextest run --locked -p grove --test ravel_policy_assets --run-ignored only {{.CLI_ARGS}}

  ravel:commands:
    desc: Check shared public lifecycle and confined commands against installed Ravel
    requires:
      vars: [RAVEL]
    env:
      GROVE_TEST_RAVEL: '{{.RAVEL}}'
    cmds:
      - cargo nextest run --locked -p grove-loop --test session_command
      - cargo nextest run --locked -p grove-loop --test session_command --run-ignored only

  ravel:activation:
    desc: Check both actual callers and inherited lifecycle/process/authority boundaries
    requires:
      vars: [RAVEL]
    cmds:
      - task: test:grove
        vars: {RAVEL: '{{.RAVEL}}'}
      - task: test:grove-loop
        vars: {RAVEL: '{{.RAVEL}}'}
      - task: test:grove-llm
      - task: test:keyed-launch
      - task: test:authority
        vars: {RAVEL: '{{.RAVEL}}'}

  ravel:fixtures:
    desc: Check shared installed-Ravel fixtures through the resolver and both stdout runners
    requires:
      vars: [RAVEL]
    cmds:
      - task: ravel:resolution
        vars: {RAVEL: '{{.RAVEL}}'}
      - task: ravel:result
        vars: {RAVEL: '{{.RAVEL}}'}

  check:
    desc: Run the repository's reusable checks
    cmds:
      - bash scripts/check.sh

  ravel:resolution:
    desc: Check PATH/version resolution and a real independently installed Ravel pair
    requires:
      vars: [RAVEL]
    env:
      GROVE_TEST_RAVEL: '{{.RAVEL}}'
    cmds:
      - cargo nextest run --locked -p grove -E 'test(dispatch::ravel::tests::)'
      - cargo nextest run --locked -p grove -E 'test(installed_front_and_worker_return_only_the_session_result)' --run-ignored only

  test:grove:
    requires:
      vars: [RAVEL]
    desc: Run Grove's caller and repository-surface regression suite with nextest
    env:
      GROVE_TEST_RAVEL: '{{.RAVEL}}'
    cmds:
      - cargo nextest run --locked -p grove {{.CLI_ARGS}}

  test:authority:
    requires:
      vars: [RAVEL]
    desc: Prove Cargo and both callers remove inherited old/new session controls
    env:
      GROVE_TEST_RAVEL: '{{.RAVEL}}'
      GROVE_SIGNAL_FILE: /inert-authority-control
      GROVE_RUN_SIGNAL_FILE: /inert-authority-control
      GROVE_LAUNCH_DIR: /inert-authority-control
      HARNESS_DISPATCH_EXIT_FILE: /inert-authority-control
      HARNESS_DISPATCH_RUN_ID: /inert-authority-control
      HARNESS_DISPATCH_STATE_DIR: /inert-authority-control
      RAVEL_EXIT_FILE: /inert-authority-control
      GROVE_HARNESS_PID: /inert-authority-control
      GROVE_CLAUDE_PID: /inert-authority-control
    cmds:
      - cargo nextest run --locked -p grove -E 'binary(env_hygiene) | test(enclosing_ravel_and_retired_controls)'

  ravel:result:
    desc: Check Grove's shared result reader through both runner APIs with installed Ravel
    requires:
      vars: [RAVEL]
    env:
      GROVE_TEST_RAVEL: '{{.RAVEL}}'
    cmds:
      - cargo nextest run --locked -p grove-loop --test session_result
      - cargo nextest run --locked -p grove-loop --test session_result_installed --run-ignored only

  test:keyed-launch:
    desc: Check job supervision, stream capture, cancellation and terminal recovery with nextest
    cmds:
      - cargo nextest run --locked -p keyed-launch {{.CLI_ARGS}}
      - cargo test --locked -p keyed-launch --doc

  test:grove-loop:
    requires:
      vars: [RAVEL]
    desc: Check Grove's task tree, driver, authority and result transport with nextest
    env:
      GROVE_TEST_RAVEL: '{{.RAVEL}}'
    cmds:
      - cargo nextest run --locked -p grove-loop {{.CLI_ARGS}}
      - cargo test --locked -p grove-loop --doc

  test:grove-llm:
    desc: Check the agent CLI, retirement guidance and tree verbs with nextest
    cmds:
      - cargo nextest run --locked -p grove-llm {{.CLI_ARGS}}

  design:harness-selection:
    desc: Serve the harness selection design at localhost (default port 8769)
    vars:
      PORT: '{{.PORT | default "8769"}}'
    cmds:
      - python3 -m http.server {{.PORT}} --bind 127.0.0.1 --directory docs/design/harness-selection-and-execution

  design:technical-communication:
    desc: Serve the technical-communication design views at localhost (default port 8770)
    vars:
      PORT: '{{.PORT | default "8770"}}'
    cmds:
      - python3 -m http.server {{.PORT}} --bind 127.0.0.1 --directory docs/design/technical-communication

  design:technical-communication:render:
    desc: Export the technical-communication design views from their D2 sources
    dir: docs/design/technical-communication
    sources:
      - '*.d2'
    generates:
      - '*.svg'
    cmds:
      - for: sources
        cmd: d2 --layout=elk --theme=0 --dark-theme=200 '{{.ITEM}}' '{{trimSuffix ".d2" .ITEM}}.svg'

  release:patch:
    desc: Publish and install the next patch release
    cmds:
      - task: release
        vars: {LEVEL: patch}

  release:minor:
    desc: Publish and install the next minor release
    cmds:
      - task: release
        vars: {LEVEL: minor}

  release:major:
    desc: Publish and install the next major release
    cmds:
      - task: release
        vars: {LEVEL: major}

  # Unreleased archives of the working copy, in the release layout, for the
  # installed-layout smoke tests. `task release:archives TARGETS=x86_64-unknown-linux-gnu`
  # builds one target; the default is every target.
  release:test:
    desc: Check the exact caller archive/formula contract and publication ordering
    cmds:
      - bash scripts/release.test.sh

  release:registration:test:
    desc: Verify combined Grove/Ravel ELF registration and missing/escape controls
    requires:
      vars: [ARCHIVES, RAVEL_ARCHIVES]
    cmds:
      - bash scripts/release-registration.test.sh "{{.ARCHIVES}}" "{{.RAVEL_ARCHIVES}}"

  release:formula:test:
    desc: Exercise the real Homebrew install/test methods with a private native archive prefix
    requires:
      vars: [ARCHIVE]
    cmds:
      - bash scripts/release-formula.test.sh "{{.ARCHIVE}}"

  release:archives:
    desc: Build release archives of the working copy into target/archives, without a tag or publication
    cmds:
      - scripts/release-build.sh --unreleased {{.TARGETS}}

  # The installed-layout smoke test, rebuilding the archives first so it never
  # reads a stale one. `task release:smoke TARGETS=x86_64-unknown-linux-gnu`
  # tests one target; the default is every target. macOS arm64 runs natively,
  # and each Linux target in a glibc-2.17 userland under a pinned user-mode
  # QEMU emulating its CPU floor, Nehalem or Cortex-A53, after a native
  # container where Docker runs the architecture; that needs an arm64 Docker
  # and Zig (scripts/release-smoke.sh). The release runs the same script over
  # target/dist before publishing. Rerun it after any change to Grove's caller
  # assets/layout, native dependencies or the admitted independent Ravel inputs.
  release:smoke:
    desc: Build archives of the working copy and smoke-test each one's installed layout on its target
    cmds:
      - task: release:archives
        vars: {TARGETS: '{{.TARGETS}}'}
      - scripts/release-smoke.sh {{.TARGETS}}

  release:notes:
    desc: Refresh Unreleased notes from all changes since the last release, without publishing
    preconditions:
      - sh: test -d .jj
        msg: Run release notes from a jj workspace.
    cmds:
      - bash scripts/release-notes.sh

  release:
    internal: true
    requires:
      vars:
        - name: LEVEL
          enum: [patch, minor, major]
    preconditions:
      - sh: test -d .jj && test -d .git && test "$(pwd -P)" = "$(jj workspace root --name default)"
        msg: Run releases from Grove's default colocated jj workspace.
    # Commands are sequential. Never move these to deps, which run in parallel.
    cmds:
      - |
        mkdir .jj/release-lock || {
          echo 'Another release holds .jj/release-lock. If it was interrupted, confirm it has stopped before removing the lock.' >&2
          exit 1
        }
      - defer: rmdir .jj/release-lock
      - scripts/release-doctor.sh
      - bash scripts/release-prepare.sh
      - scripts/release-publish.sh --check-tap
      - bash scripts/check.sh
      - cargo release {{.LEVEL}}
      - cargo release {{.LEVEL}} --execute --no-confirm
      - jj bookmark set main -r "$(git rev-parse HEAD)"
      - scripts/release-build.sh
      # Nothing is published before this passes: each archive in target/dist
      # matches the manifest and runs its installed layout on its target at
      # the floors. A failure leaves the cut local; docs/RELEASING.md,
      # "If the installed smoke test fails", gives the recovery.
      - scripts/release-smoke.sh --archives target/dist
      - jj git push -b main
      - git push origin "$(git describe --tags --exact-match HEAD)"
      - scripts/release-publish.sh
      - brew update
      - |
        if brew list --versions grove >/dev/null 2>&1; then
          brew upgrade grove
        else
          brew install linkuistics/taps/grove
        fi
      - brew test grove
      - |
        tag="$(git describe --tags --exact-match HEAD)"
        version="${tag#v}"
        # The Homebrew prefix's commands, not whichever copy PATH finds first:
        # Verify Grove from its keg and Ravel as an independent dependency.
        brew_bin="$(brew --prefix)/bin"
        test "$("$brew_bin/grove" --version)" = "grove $version"
        test "$("$brew_bin/grove-llm" --version)" = "grove-llm $version"
        "$brew_bin/ravel" --version
        "$brew_bin/grove" view --help
        # Homebrew tests lifecycle inside its own sandbox; exercise Ravel's
        # actual confinement outside that non-nestable outer sandbox too.
        bash scripts/grove-installed-smoke.sh "$(brew --prefix grove)" "$version" "$(brew --prefix ravel)"
        gh release view "$tag" --repo Linkuistics/grove --json url,assets
        test "$(gh release view "$tag" --repo Linkuistics/grove --json assets --jq '.assets | length')" = 3
