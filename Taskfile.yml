version: '3'

# Tasks that run installed-Ravel fixtures take RAVEL, the absolute front of one
# build, and RAVEL_RUNTIME, its configuration runtime: 1.1 for policy.ts with
# schema 2, or 2.0 for config.rhai with SCHEMA_VERSION 4. Each passes them on as
# GROVE_TEST_RAVEL and GROVE_TEST_RAVEL_RUNTIME. An exported
# GROVE_TEST_RAVEL_RUNTIME takes precedence. An unset runtime means 1.1, and
# the test support refuses it for a build without the 1.x worker
# (testing/ravel.rs). For example:
#   task ravel:activation RAVEL=/opt/ravel-2/bin/ravel RAVEL_RUNTIME=2.0

set: [errexit, nounset, pipefail]

tasks:
  release:floor:seccomp:controls:
    desc: Check the pinned seccomp derivation of the QEMU floor route and changed/missing source refusals
    cmds:
      - bash scripts/floor-seccomp.test.sh

  legacy:prepare:
    desc: Read and back up the complete original 22.1.0 keg without modifying installation or PATH
    requires:
      vars: [KEG, STABLE_BIN, OUT]
    cmds:
      - python3 scripts/legacy_driver_transition.py prepare --keg "{{.KEG}}" --stable-bin "{{.STABLE_BIN}}" --output "{{.OUT}}"

  legacy:apply:
    desc: Require cleanup suppression and create absent owned original-command PATH links
    requires:
      vars: [PLAN]
    cmds:
      - python3 scripts/legacy_driver_transition.py apply --plan "{{.PLAN}}"

  legacy:verify:
    desc: Verify complete original keg/backup bytes, cleanup suppression and inherited PATH resolution
    requires:
      vars: [PLAN]
    cmds:
      - python3 scripts/legacy_driver_transition.py verify --plan "{{.PLAN}}"

  legacy:cleanup:
    desc: Remove owned compatibility links only after the original driver is confirmed reaped
    requires:
      vars: [PLAN, DRIVER_ENDED]
    preconditions:
      - sh: test "{{.DRIVER_ENDED}}" = yes
        msg: Confirm the original driver and its sessions are reaped; never run before its last signal.
    cmds:
      - python3 scripts/legacy_driver_transition.py cleanup --plan "{{.PLAN}}" --driver-ended

  legacy:controls:
    desc: Run isolated complete-keg, link ownership, cleanup and refusal controls
    cmds:
      - python3 scripts/test_legacy_driver_transition.py

  # ALSO names another Ravel prefix, such as a 2.0 build, installed beside the
  # 1.1 keg. The rehearsal puts it first on PATH and checks after each package
  # step that the 1.1 ending executable still works and that neither changed.
  legacy:rehearsal:
    desc: Rehearse scratch upgrade/unlink with the actual old front/worker and independent Ravel
    requires:
      vars: [KEG, RAVEL, OUT]
    cmds:
      - python3 scripts/legacy_driver_rehearsal.py --keg "{{.KEG}}" --ravel "{{.RAVEL}}" --output "{{.OUT}}" {{if .ALSO}}--also-installed "{{.ALSO}}"{{end}}

  # LANE selects the recorded Ravel archives: 1.1 (default), the published
  # 1.1.0 release, or 2.0, the recorded 2.0 build. ARCHIVES_2 is the 2.0 lane's
  # directory, by default target/ravel-archives-2.0, which is never downloaded.
  # See docs/ravel-target-inputs.md.
  ravel:targets:prepare:
    desc: Validate one lane's recorded Ravel archives (1.1 fetches its pins) and expose separate fresh target prefixes
    requires:
      vars: [OUT]
    cmds:
      - python3 scripts/ravel_target_inputs.py --lane "{{.LANE | default "1.1"}}" {{if .ARCHIVES}}--archives "{{.ARCHIVES}}"{{end}} --output "{{.OUT}}" {{.TARGETS}}

  ravel:targets:status:
    desc: Name the targets each lane records, and why the others do not run
    cmds:
      - python3 scripts/ravel_target_inputs.py --lane 1.1 --status
      - python3 scripts/ravel_target_inputs.py --lane 2.0 --status

  ravel:targets:controls:
    desc: Check archive admission and real recorded-layout refusals of both lanes without a host runtime
    requires:
      vars: [ARCHIVES]
    cmds:
      - python3 scripts/test_ravel_target_inputs.py
      - bash scripts/ravel-target-inputs.test.sh "{{.ARCHIVES}}" {{if .ARCHIVES_2}}"{{.ARCHIVES_2}}"{{end}}

  ravel:targets:smoke:
    desc: Run both lanes' recorded Ravel layouts natively and at Linux glibc/CPU floors with fake agents
    cmds:
      - bash scripts/ravel-target-smoke.sh {{if .ARCHIVES}}--archives "{{.ARCHIVES}}"{{end}} {{if .ARCHIVES_2}}--archives-2.0 "{{.ARCHIVES_2}}"{{end}} {{.TARGETS}}

  ravel:review:
    desc: Check creator-aware Grove review assets, launch/retirement provenance
    requires:
      vars: [RAVEL]
    cmds:
      - task: ravel:provenance
        vars: {RAVEL: '{{.RAVEL}}', RAVEL_RUNTIME: '{{.RAVEL_RUNTIME}}'}

  ravel:provenance:
    desc: Check Grove-owned selected-provider evidence, retirement and inherited-evidence isolation
    requires:
      vars: [RAVEL]
    env:
      GROVE_TEST_RAVEL: '{{.RAVEL}}'
      GROVE_TEST_RAVEL_RUNTIME: '{{.RAVEL_RUNTIME}}'
      GROVE_PROVIDER_EVIDENCE: /inert-enclosing-evidence
    cmds:
      - task: ravel:policy
        vars: {RAVEL: '{{.RAVEL}}', RAVEL_RUNTIME: '{{.RAVEL_RUNTIME}}'}
      - cargo nextest run --locked -p grove --test creator_lifecycle --test env_hygiene
      - cargo nextest run --locked -p grove -E 'test(enclosing_ravel_and_retired_controls)'
      - cargo nextest run --locked -p grove-llm --test composition_guidance
      - bash plugins/grove/conformance.sh

  ravel:policy:
    desc: Check Grove's caller assets of the selected runtime through the independent installed Ravel build
    requires:
      vars: [RAVEL]
    cmds:
      # Ravel 2.0 has no SDK or typechecker. Its Rhai assets run through public
      # start-session in ravel:policy:runtime instead.
      - task: ravel:policy:typecheck
        if: '[ "{{.RAVEL_RUNTIME}}" != 2.0 ]'
        vars: {RAVEL: '{{.RAVEL}}', RAVEL_RUNTIME: '{{.RAVEL_RUNTIME}}'}
      - task: ravel:policy:compiler-test
        if: '[ "{{.RAVEL_RUNTIME}}" != 2.0 ]'
        vars: {RAVEL: '{{.RAVEL}}', RAVEL_RUNTIME: '{{.RAVEL_RUNTIME}}'}
      - task: ravel:policy:runtime
        vars: {RAVEL: '{{.RAVEL}}', RAVEL_RUNTIME: '{{.RAVEL_RUNTIME}}'}

  ravel:policy:deps:
    desc: Install Grove's pinned development compiler for its caller-owned policy assets
    dir: tools/ravel-policy
    cmds:
      # The helper selects the Bun that mise.toml pins.
      - bash ../../scripts/pinned-bun.sh install --frozen-lockfile

  ravel:policy:compiler-test:
    desc: Prove public-SDK typechecking works without dispatch source and refuses invalid inputs
    requires:
      vars: [RAVEL]
    env:
      GROVE_TEST_RAVEL: '{{.RAVEL}}'
      GROVE_TEST_RAVEL_RUNTIME: '{{.RAVEL_RUNTIME}}'
    cmds:
      - bash scripts/ravel-policy-typecheck.test.sh

  ravel:policy:typecheck:
    desc: Typecheck Grove policy assets and ordinary imports against installed Ravel declarations
    requires:
      vars: [RAVEL]
    cmds:
      - task: ravel:policy:deps
      - bash scripts/ravel-policy-typecheck.sh "{{.RAVEL}}"

  ravel:policy:runtime:
    desc: Run the shared case table of both asset sets through copied installed Ravel with fake agents and isolated PATH
    requires:
      vars: [RAVEL]
    env:
      GROVE_TEST_RAVEL: '{{.RAVEL}}'
      GROVE_TEST_RAVEL_RUNTIME: '{{.RAVEL_RUNTIME}}'
    cmds:
      - cargo nextest run --locked -p grove --test ravel_asset_cases --run-ignored only {{.CLI_ARGS}}

  ravel:commands:
    desc: Check shared public lifecycle and standalone commands against installed Ravel
    requires:
      vars: [RAVEL]
    env:
      GROVE_TEST_RAVEL: '{{.RAVEL}}'
      GROVE_TEST_RAVEL_RUNTIME: '{{.RAVEL_RUNTIME}}'
    cmds:
      - cargo nextest run --locked -p grove-loop --test session_command
      - cargo nextest run --locked -p grove-loop --test session_command --run-ignored only

  ravel:job:
    desc: Check the foreground handover of the shared function against installed Ravel on a pseudo-terminal
    requires:
      vars: [RAVEL]
    env:
      GROVE_TEST_RAVEL: '{{.RAVEL}}'
      GROVE_TEST_RAVEL_RUNTIME: '{{.RAVEL_RUNTIME}}'
    cmds:
      - cargo nextest run --locked -p grove-loop --test ravel_job_terminal --run-ignored only

  ravel:activation:
    desc: Check both actual callers and inherited lifecycle/process/authority boundaries
    requires:
      vars: [RAVEL]
    cmds:
      - task: test:grove
        vars: {RAVEL: '{{.RAVEL}}', RAVEL_RUNTIME: '{{.RAVEL_RUNTIME}}'}
      - task: test:grove-loop
        vars: {RAVEL: '{{.RAVEL}}', RAVEL_RUNTIME: '{{.RAVEL_RUNTIME}}'}
      - task: ravel:job
        vars: {RAVEL: '{{.RAVEL}}', RAVEL_RUNTIME: '{{.RAVEL_RUNTIME}}'}
      - task: test:grove-llm
        vars: {RAVEL: '{{.RAVEL}}', RAVEL_RUNTIME: '{{.RAVEL_RUNTIME}}'}
      - task: test:authority
        vars: {RAVEL: '{{.RAVEL}}', RAVEL_RUNTIME: '{{.RAVEL_RUNTIME}}'}

  ravel:directory:
    desc: "Check the directory route on Ravel 2.0 through the lifecycle and standalone callers: RAVEL is the 2.0 front, OLD the 1.1 front of the pair case"
    requires:
      vars: [RAVEL, OLD]
    env:
      GROVE_TEST_RAVEL: '{{.RAVEL}}'
      GROVE_TEST_RAVEL_RUNTIME: '2.0'
      GROVE_TEST_RAVEL_OLD: '{{.OLD}}'
    cmds:
      - cargo nextest run --locked -p grove --test directory_route --run-ignored only {{.CLI_ARGS}}

  # Real harness trials of the common loading route
  # (docs/common-loading-acceptance-record.md). A trial spends subscription
  # usage, so only trial:controls joins scripts/check.sh. OUT is a scratch
  # directory outside every working copy. COMMIT is the recorded Grove commit
  # that supplies the driver and the skill sources. RAVEL is the 2.0 front from
  # the stage record's recipe, which builds.json pins.
  trial:prepare:
    desc: Build Grove at COMMIT into OUT and check the Ravel 2.0 front RAVEL, for real harness trials (KEG names the candidate keg of COMMIT, from task owner:candidate-keg, for keg sources)
    requires:
      vars: [OUT, COMMIT, RAVEL]
    cmds:
      - python3 scripts/harness_trial.py prepare --out "{{.OUT}}" --commit "{{.COMMIT}}" --ravel "{{.RAVEL}}" {{if .KEG}}--keg "{{.KEG}}"{{end}}

  trial:check:
    desc: Check that the Grove COMMIT supplies each required path of the trial CASE, or of every case without CASE, before any launch (no harness, no model, no build; KEG names the candidate keg of COMMIT for keg sources)
    requires:
      vars: [COMMIT]
    cmds:
      - python3 -I scripts/harness_trial.py check --commit "{{.COMMIT}}" {{if .CASE}}--case "{{.CASE}}"{{end}} {{if .KEG}}--keg "{{.KEG}}"{{end}}

  trial:claude:
    desc: Run one real Claude Code trial CASE from the prepared OUT (spends subscription usage; MODEL and EFFORT override the case; WORKING_COPY=ID=DIR replaces one external source's checkout)
    requires:
      vars: [OUT, CASE]
    cmds:
      - python3 scripts/harness_trial.py run --prepared "{{.OUT}}" --case "{{.CASE}}" {{if .MODEL}}--model "{{.MODEL}}"{{end}} {{if .EFFORT}}--effort "{{.EFFORT}}"{{end}} {{if .WORKING_COPY}}--working-copy "{{.WORKING_COPY}}"{{end}}

  trial:codex:
    desc: Run one real Codex trial CASE from the prepared OUT, in the case's tree (spends subscription usage; MODEL and EFFORT override the Codex defaults; WORKING_COPY=ID=DIR replaces one external source's checkout)
    requires:
      vars: [OUT, CASE]
    cmds:
      - python3 scripts/harness_trial.py run --prepared "{{.OUT}}" --case "{{.CASE}}" --harness codex {{if .MODEL}}--model "{{.MODEL}}"{{end}} {{if .EFFORT}}--effort "{{.EFFORT}}"{{end}} {{if .WORKING_COPY}}--working-copy "{{.WORKING_COPY}}"{{end}}

  trial:reextract:
    desc: Extract the events of the earlier trial run TRIAL again from its transcripts, with the current classifier
    requires:
      vars: [TRIAL]
    cmds:
      - python3 scripts/harness_trial.py reextract --trial "{{.TRIAL}}"

  trial:controls:
    desc: Test the harness trial runner against fake harnesses, each check also against a broken runner
    cmds:
      - python3 -I scripts/test_harness_trial.py

  ravel:fixtures:
    desc: Check shared installed-Ravel fixtures through the resolver and Grove's shared result reader
    requires:
      vars: [RAVEL]
    cmds:
      - task: ravel:resolution
        vars: {RAVEL: '{{.RAVEL}}', RAVEL_RUNTIME: '{{.RAVEL_RUNTIME}}'}
      - task: ravel:result
        vars: {RAVEL: '{{.RAVEL}}', RAVEL_RUNTIME: '{{.RAVEL_RUNTIME}}'}

  check:
    desc: Run the repository's reusable checks
    cmds:
      - bash scripts/check.sh

  check:skills:
    desc: Check Grove guidance conformance, the pinned external packs and that startup writes no native skills
    env:
      GROVE_TEST_RAVEL_RUNTIME: '{{.RAVEL_RUNTIME}}'
    cmds:
      - bash plugins/grove/conformance.sh
      - bash plugins/grove/conformance.test.sh
      - task: check:packs
      - bash scripts/check-packs.test.sh
      - GROVE_TEST_RAVEL="${GROVE_TEST_RAVEL:-$(command -v ravel)}" cargo nextest run --locked -p grove --test plugin_fallback --test native_skill_delivery

  check:packs:
    desc: Check each pack that the pack record plugins/packs.json names, alone and in the aggregate with this working tree
    cmds:
      - bash scripts/check-packs.sh

  ravel:resolution:
    desc: Check PATH/version resolution and a real independently installed Ravel pair
    requires:
      vars: [RAVEL]
    env:
      GROVE_TEST_RAVEL: '{{.RAVEL}}'
      GROVE_TEST_RAVEL_RUNTIME: '{{.RAVEL_RUNTIME}}'
    cmds:
      - cargo nextest run --locked -p grove -E 'test(dispatch::ravel::tests::)'
      - cargo nextest run --locked -p grove -E 'test(installed_front_and_worker_return_only_the_session_result)' --run-ignored only

  test:grove:
    requires:
      vars: [RAVEL]
    desc: Run Grove's caller and repository-surface regression suite with nextest
    env:
      GROVE_TEST_RAVEL: '{{.RAVEL}}'
      GROVE_TEST_RAVEL_RUNTIME: '{{.RAVEL_RUNTIME}}'
    cmds:
      - cargo nextest run --locked -p grove {{.CLI_ARGS}}

  test:authority:
    requires:
      vars: [RAVEL]
    desc: Prove Cargo and both callers remove inherited old/new session controls
    env:
      GROVE_TEST_RAVEL: '{{.RAVEL}}'
      GROVE_TEST_RAVEL_RUNTIME: '{{.RAVEL_RUNTIME}}'
      GROVE_SIGNAL_FILE: /inert-authority-control
      GROVE_RUN_SIGNAL_FILE: /inert-authority-control
      GROVE_LAUNCH_DIR: /inert-authority-control
      HARNESS_DISPATCH_EXIT_FILE: /inert-authority-control
      HARNESS_DISPATCH_RUN_ID: /inert-authority-control
      HARNESS_DISPATCH_STATE_DIR: /inert-authority-control
      RAVEL_EXIT_FILE: /inert-authority-control
      GROVE_HARNESS_PID: /inert-authority-control
      GROVE_CLAUDE_PID: /inert-authority-control
    cmds:
      - cargo nextest run --locked -p grove -E 'binary(env_hygiene) | test(enclosing_ravel_and_retired_controls)'

  ravel:result:
    desc: Check Grove's shared result reader through both shapes of the shared launch function with installed Ravel
    requires:
      vars: [RAVEL]
    env:
      GROVE_TEST_RAVEL: '{{.RAVEL}}'
      GROVE_TEST_RAVEL_RUNTIME: '{{.RAVEL_RUNTIME}}'
    cmds:
      - cargo nextest run --locked -p grove-loop --test session_result
      - cargo nextest run --locked -p grove-loop --test session_result_installed --run-ignored only

  test:grove-loop:
    requires:
      vars: [RAVEL]
    desc: Check Grove's task tree, driver, authority and result transport with nextest
    env:
      GROVE_TEST_RAVEL: '{{.RAVEL}}'
      GROVE_TEST_RAVEL_RUNTIME: '{{.RAVEL_RUNTIME}}'
    cmds:
      - cargo nextest run --locked -p grove-loop {{.CLI_ARGS}}
      - cargo test --locked -p grove-loop --doc

  test:grove-llm:
    requires:
      vars: [RAVEL]
    desc: Check the agent CLI, retirement guidance and tree verbs with nextest
    env:
      GROVE_TEST_RAVEL: '{{.RAVEL}}'
      GROVE_TEST_RAVEL_RUNTIME: '{{.RAVEL_RUNTIME}}'
    cmds:
      - cargo nextest run --locked -p grove-llm {{.CLI_ARGS}}

  design:harness-selection:
    desc: Serve the harness selection design at localhost (default port 8769)
    vars:
      PORT: '{{.PORT | default "8769"}}'
    cmds:
      - python3 -m http.server {{.PORT}} --bind 127.0.0.1 --directory docs/design/harness-selection-and-execution

  design:external-pack-contract:
    desc: Serve the external pack contract views at localhost (default port 8793)
    vars:
      PORT: '{{.PORT | default "8793"}}'
    cmds:
      - python3 -m http.server {{.PORT}} --bind 127.0.0.1 --directory docs/design/external-pack-contract

  owner:inventory:
    desc: Print the owner's skill-installation inventory as TSV, reading only; compare it per entry with docs/owner-skill-inventory.tsv
    cmds:
      - python3 -I docs/evaluations/owner-skill-delivery/inventory.py

  owner:inventory:compare:
    desc: Compare two owner inventories per entry, skipping only the two platform subtrees, and fail on each difference or anomaly row
    requires:
      vars: [BEFORE, AFTER]
    cmds:
      - python3 -I docs/evaluations/owner-skill-delivery/inventory.py compare "{{.BEFORE}}" "{{.AFTER}}"

  owner:inventory:controls:
    desc: Check in a fixture HOME that the owner inventory sees each class of change
    cmds:
      - python3 -I docs/evaluations/owner-skill-delivery/controls.py

  # The owner's Rhai configuration against the policy.ts that it converts
  # ("Policy conversion" of docs/owner-skill-delivery-evidence.md). OUT is a
  # new directory. TS and RHAI replace the default inputs, the owner's
  # policy.ts and the committed candidate. The task needs the accepted 2.0
  # archive in target/ravel-archives-2.0 and the Ravel 1.1.0 keg. Each case
  # launches only fake agents. For example:
  #   task owner:policy-equivalence OUT="$SCRATCH/equivalence"
  owner:policy-equivalence:
    desc: Compare the owner's config.rhai under the accepted Ravel 2.0 build with policy.ts under the 1.1.0 keg, per kind and directory, with fake agents, and write OUT/record.json
    requires:
      vars: [OUT]
    cmds:
      - python3 -I docs/evaluations/owner-skill-delivery/policy_equivalence.py --out "{{.OUT}}" {{if .TS}}--ts "{{.TS}}"{{end}} {{if .RHAI}}--rhai "{{.RHAI}}"{{end}}

  # The owner's drafted Ravel skill settings and skill formulae in
  # docs/owner-cutover ("Owner settings drafts" of
  # docs/owner-skill-delivery-evidence.md). OUT is a new directory. The task
  # needs the accepted 2.0 archive in target/ravel-archives-2.0. It runs only
  # `ravel skills resolve` in private HOMEs and launches no harness. Remove OUT
  # with `chmod -R u+w OUT && rm -rf OUT`. For example:
  #   task owner:settings-drafts OUT="$SCRATCH/settings-drafts"
  owner:settings-drafts:
    desc: Resolve each drafted Ravel skill settings value with the accepted 2.0 build over a fixture default skill directory, check the skill formula declarations, and write OUT/record.json
    requires:
      vars: [OUT]
    cmds:
      - python3 -I docs/evaluations/owner-skill-delivery/settings_drafts.py --out "{{.OUT}}"

  # The owner's real switch plan draft in docs/owner-cutover ("Owner switch
  # plan draft" of docs/owner-skill-delivery-evidence.md). The draft task
  # reads the real HOME and the reference inventory, and writes the plan and
  # its part table. The check task builds a disposable HOME from the draft in
  # the new directory OUT, runs the program's loader, `run --dry-run` and
  # five controls, and lists the real process tree against the plan's
  # patterns. Neither changes the real HOME. For example:
  #   task owner:switch-plan:check OUT="$SCRATCH/switch-plan"
  owner:switch-plan:draft:
    desc: Write docs/owner-cutover/switch-plan-draft.json and its part table from the real HOME, reading only
    cmds:
      - python3 -I docs/evaluations/owner-skill-delivery/switch_plan_draft.py draft

  owner:switch-plan:check:
    desc: Admit the switch plan draft and dry-run it in a disposable HOME in OUT, with its controls and the process listing, and write OUT/record.json
    requires:
      vars: [OUT]
    cmds:
      - python3 -I docs/evaluations/owner-skill-delivery/switch_plan_draft.py check --out "{{.OUT}}"

  # The candidate keg of the staging trials ("Skill formulae" and "Cutover
  # contract" of docs/specs/owner-skill-delivery.md). COMMIT names the
  # candidate, OUT a new directory outside every working copy and
  # RAVEL_2_0_PREFIX an installation prefix of the 2.0 build. ACCEPTED names an
  # earlier OUT/digests.tsv, and a different digest fails. For example:
  #   task owner:candidate-keg COMMIT=<grove commit> OUT="$SCRATCH/candidate" \
  #     RAVEL_2_0_PREFIX="$SCRATCH/ravel-2.0"
  owner:candidate-keg:
    desc: Build the candidate keg of the Grove COMMIT into the new directory OUT and print the resourceDigest of each of its six sources
    requires:
      vars: [COMMIT, OUT, RAVEL_2_0_PREFIX]
    cmds:
      - bash scripts/candidate-keg.sh "{{.COMMIT}}" "{{.OUT}}" "{{.RAVEL_2_0_PREFIX}}" {{if .ACCEPTED}}"{{.ACCEPTED}}"{{end}}

  # The owner switch program ("The switch inside finish" and "The rehearsed
  # plan" of docs/specs/owner-skill-delivery.md). OUT is a new directory
  # outside every working copy. ONLY limits the controls to the names that
  # match a regular expression, and the record is then partial.
  # Each rehearsal also reruns settings-writes.sh with the installed claude,
  # and the record names its version. The rerun reads the WritingSkills
  # checkout beside this one and takes several minutes. SKIP_SETTINGS_WRITES=1
  # leaves it out, and the record is then partial. For example:
  #   task owner:switch:rehearse OUT="$SCRATCH/rehearsal"
  owner:switch:rehearse:
    desc: Rehearse scripts/owner_switch.py on a fixture plan in disposable layouts, and write OUT/record.json with the plan, the program and each control's result
    requires:
      vars: [OUT]
    cmds:
      - python3 -I scripts/owner_switch_rehearsal.py rehearse --out "{{.OUT}}" {{if .ONLY}}--only "{{.ONLY}}"{{end}} {{if .SKIP_SETTINGS_WRITES}}--skip-settings-writes{{end}}

  model:owner-switch:
    desc: Run every claim of the Quint model of the owner switch's recovery (SAMPLES, STEPS and SWEEP adjust the run)
    cmds:
      - bash docs/models/run-owner-switch.sh

  release:patch:
    desc: Publish and install the next patch release
    cmds:
      - task: release
        vars: {LEVEL: patch}

  release:minor:
    desc: Publish and install the next minor release
    cmds:
      - task: release
        vars: {LEVEL: minor}

  release:major:
    desc: Publish and install the next major release
    cmds:
      - task: release
        vars: {LEVEL: major}

  # Unreleased archives of the working copy, in the release layout, for the
  # installed-layout smoke tests. `task release:archives TARGETS=x86_64-unknown-linux-gnu`
  # builds one target; the default is every target.
  release:test:
    desc: Check the exact caller archive/formula contract and publication ordering
    cmds:
      - bash scripts/release.test.sh

  release:registration:test:
    desc: Verify combined Grove/Ravel ELF registration and missing/escape controls
    requires:
      vars: [ARCHIVES, RAVEL_ARCHIVES]
    cmds:
      - bash scripts/release-registration.test.sh "{{.ARCHIVES}}" "{{.RAVEL_ARCHIVES}}" {{if .RAVEL_ARCHIVES_2}}"{{.RAVEL_ARCHIVES_2}}"{{end}}

  # RAVEL_1_1_PREFIX and RAVEL_2_0_PREFIX are installation prefixes, not
  # fronts. The 1.1 build checks the TypeScript set and the 2.0 build the Rhai
  # set and the keg's skill sources. OLD is the published Grove keg of tap
  # states A and B. The archive's packs need their checkouts from
  # `task check:packs`, and core's working files must equal HEAD. For example:
  #   task release:formula:test ARCHIVE=target/archives/grove-v<ver>-aarch64-apple-darwin.tar.xz \
  #     RAVEL_1_1_PREFIX=/opt/homebrew/Cellar/ravel/1.1.0 RAVEL_2_0_PREFIX=/opt/ravel-2 \
  #     OLD=/opt/homebrew/Cellar/grove/22.8.0
  release:formula:test:
    desc: Exercise the real Homebrew install/test methods, the keg's skill digests and tap states A to D with both Ravel builds
    requires:
      vars: [ARCHIVE, RAVEL_1_1_PREFIX, RAVEL_2_0_PREFIX, OLD]
    cmds:
      - bash scripts/release-formula.test.sh "{{.ARCHIVE}}" "{{.RAVEL_1_1_PREFIX}}" "{{.RAVEL_2_0_PREFIX}}" "{{.OLD}}"

  # One skill formula of the Linkuistics tap, such as `personal`, in a private
  # Homebrew-shaped prefix. FORMULA is its file in a tap working copy. REPO and
  # SHA name the commit that it installs. SOURCES lists each keg source as
  # ID=PATH, with PATH its source directory in that commit. RAVEL_2_0_PREFIX is
  # an installation prefix. The test downloads the formula's URL. For example:
  #   task tap:formula:test FORMULA=~/Development/Delivery/homebrew-taps/Formula/personal.rb \
  #     RAVEL_2_0_PREFIX=/opt/ravel-2 REPO=https://github.com/Linkuistics/PersonalSkills.git \
  #     SHA=cddcfde901cdaf8069e2aac6f3b6bc5aba9fe925 SOURCES=personal=plugins/personal
  tap:formula:test:
    desc: Install and test one tap skill formula in a private prefix, compare its sources with their commit and register its marketplace
    requires:
      vars: [FORMULA, RAVEL_2_0_PREFIX, REPO, SHA, SOURCES]
    cmds:
      - bash scripts/tap-formula.test.sh "{{.FORMULA}}" "{{.RAVEL_2_0_PREFIX}}" "{{.REPO}}" "{{.SHA}}" {{.SOURCES}}

  release:archives:
    desc: Build release archives of the working copy into target/archives, without a tag or publication
    cmds:
      - scripts/release-build.sh --unreleased {{.TARGETS}}

  # The installed callers of one native archive against both explicit Ravel
  # builds, each in its own HOME: the TypeScript set against RAVEL_1_1_PREFIX
  # and the Rhai set against RAVEL_2_0_PREFIX. For example:
  #   task release:installed ARCHIVE=target/archives/grove-v<ver>-aarch64-apple-darwin.tar.xz \
  #     RAVEL_1_1_PREFIX=/opt/homebrew/Cellar/ravel/1.1.0 RAVEL_2_0_PREFIX=/opt/ravel-2
  release:installed:
    desc: Run the installed caller smoke of one native archive against explicit Ravel 1.1 and 2.0 prefixes
    requires:
      vars: [ARCHIVE, RAVEL_1_1_PREFIX, RAVEL_2_0_PREFIX]
    cmds:
      - |
        scratch="$(mktemp -d)"
        trap 'rm -rf "$scratch"' EXIT
        top="$(basename "{{.ARCHIVE}}" .tar.xz)"
        version="${top#grove-v}"
        version="${version%-aarch64-apple-darwin}"
        tar -xJf "{{.ARCHIVE}}" -C "$scratch"
        bash scripts/grove-installed-smoke.sh "$scratch/$top" "$version" "{{.RAVEL_1_1_PREFIX}}" "{{.RAVEL_2_0_PREFIX}}"

  # An installed upgrade from a Grove 22.8 layout, such as its Homebrew keg,
  # which the check only copies. It runs natively with the 1.1 build. For example:
  #   task release:upgrade OLD=/opt/homebrew/Cellar/grove/22.8.0 \
  #     ARCHIVE=target/archives/grove-v<ver>-aarch64-apple-darwin.tar.xz \
  #     RAVEL_1_1_PREFIX=/opt/homebrew/Cellar/ravel/1.1.0
  release:upgrade:
    desc: Upgrade a scratch copy of a Grove 22.8 installation; no native entry changes and an active 22.8 reader completes
    requires:
      vars: [OLD, ARCHIVE, RAVEL_1_1_PREFIX]
    cmds:
      - |
        scratch="$(mktemp -d)"
        trap 'rm -rf "$scratch"' EXIT
        top="$(basename "{{.ARCHIVE}}" .tar.xz)"
        version="${top#grove-v}"
        version="${version%-aarch64-apple-darwin}"
        tar -xJf "{{.ARCHIVE}}" -C "$scratch"
        bash scripts/grove-installed-upgrade.sh "{{.OLD}}" "$scratch/$top" "$version" "{{.RAVEL_1_1_PREFIX}}"

  # The installed-layout smoke test, rebuilding the archives first so it never
  # reads a stale one. `task release:smoke TARGETS=x86_64-unknown-linux-gnu`
  # tests one target; the default is every target. macOS arm64 runs natively,
  # and each Linux target in a glibc-2.17 userland under a pinned user-mode
  # QEMU emulating its CPU floor, Nehalem or Cortex-A53, after a native
  # container where Docker runs the architecture; that needs an arm64 Docker
  # and Zig (scripts/release-smoke.sh). The release runs the same script over
  # target/dist before publishing. Rerun it after any change to Grove's caller
  # assets/layout, native dependencies or the admitted independent Ravel inputs.
  release:smoke:
    desc: Build archives of the working copy and smoke-test each one's installed layout on its target
    cmds:
      - task: release:archives
        vars: {TARGETS: '{{.TARGETS}}'}
      - scripts/release-smoke.sh {{.TARGETS}}

  release:notes:
    desc: Refresh Unreleased notes from all changes since the last release, without publishing
    preconditions:
      - sh: test -d .jj
        msg: Run release notes from a jj workspace.
    cmds:
      - bash scripts/release-notes.sh

  release:
    internal: true
    requires:
      vars:
        - name: LEVEL
          enum: [patch, minor, major]
    preconditions:
      - sh: test -d .jj && test -d .git && test "$(pwd -P)" = "$(jj workspace root --name default)"
        msg: Run releases from Grove's default colocated jj workspace.
    # Commands are sequential. Never move these to deps, which run in parallel.
    cmds:
      - |
        mkdir .jj/release-lock || {
          echo 'Another release holds .jj/release-lock. If it was interrupted, confirm it has stopped before removing the lock.' >&2
          exit 1
        }
      - defer: rmdir .jj/release-lock
      - scripts/release-doctor.sh
      - bash scripts/release-prepare.sh
      - scripts/release-publish.sh --check-tap
      - bash scripts/check.sh
      - cargo release {{.LEVEL}}
      - cargo release {{.LEVEL}} --execute --no-confirm
      - jj bookmark set main -r "$(git rev-parse HEAD)"
      - scripts/release-build.sh
      # Nothing is published before this passes: each archive in target/dist
      # matches the manifest and runs its installed layout on its target at
      # the floors. A failure leaves the cut local; docs/RELEASING.md,
      # "If the installed smoke test fails", gives the recovery.
      - scripts/release-smoke.sh --archives target/dist
      - jj git push -b main
      - git push origin "$(git describe --tags --exact-match HEAD)"
      - scripts/release-publish.sh
      - brew update
      - |
        if brew list --versions grove >/dev/null 2>&1; then
          brew upgrade grove
        else
          brew install linkuistics/taps/grove
        fi
      - brew test grove
      - |
        tag="$(git describe --tags --exact-match HEAD)"
        version="${tag#v}"
        # The Homebrew prefix's commands, not whichever copy PATH finds first:
        # Verify Grove from its keg and Ravel as an independent dependency.
        brew_bin="$(brew --prefix)/bin"
        test "$("$brew_bin/grove" --version)" = "grove $version"
        test "$("$brew_bin/grove-llm" --version)" = "grove-llm $version"
        "$brew_bin/ravel" --version
        "$brew_bin/grove" view --help
        # Homebrew tests the lifecycle inside its own sandbox. The installed
        # smoke runs standalone publication outside it. The
        # dependency's major names its lane. While it is 1.x, an installed
        # keg-only ravel@2 adds the 2.0 lane through its explicit prefix.
        dependency="$(brew --prefix ravel)"
        ravel_two="$(brew --prefix --installed ravel@2 2>/dev/null || true)"
        case "$("$dependency/bin/ravel" --version)" in
          'ravel 2.'*) set -- - "$dependency" ;;
          *) set -- "$dependency" ${ravel_two:+"$ravel_two"} ;;
        esac
        bash scripts/grove-installed-smoke.sh "$(brew --prefix grove)" "$version" "$@"
        gh release view "$tag" --repo Linkuistics/grove --json url,assets
        test "$(gh release view "$tag" --repo Linkuistics/grove --json assets --jq '.assets | length')" = 3
