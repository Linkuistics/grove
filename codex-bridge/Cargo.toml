[package]
name = "codex-bridge"
version = "0.1.0"
edition = "2021"
publish = false
description = "Falsification harness for AgentAnyware's success-demonstration-k11 grove — not a Grove feature."

[[bin]]
name = "codex-bridge"
path = "src/main.rs"

[dependencies]
# Wire types only — never `agentanyware-core` itself, a different repo's
# internal crate. This binary speaks the JSON `records.jsonl` already
# defines, the same way any non-Rust consumer would have to.
uuid = "1"
serde_json = "1"
base64 = "0.22"
