[package]
name = "book-validation"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[lints]
workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.10"

[[bin]]
name = "book-check"
path = "src/main.rs"
