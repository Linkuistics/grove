[package]
name = "grove-tui"
description = "Read-only terminal viewer for Grove task trees"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0"
grove-loop = { path = "../grove-loop" }
# Cargo.lock keeps instability at 0.3.7 for the workspace's Rust 1.85 floor.
# Its published manifest: https://docs.rs/crate/instability/0.3.7/source/Cargo.toml
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = "0.28.1"

[dev-dependencies]
tempfile = "3.10"
libc = "0.2"

[lints]
workspace = true

[package.metadata.release]
release = false
