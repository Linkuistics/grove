[package]
name = "grove-tui"
description = "Read-only terminal viewer for Grove task trees"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0"
grove-loop = { path = "../grove-loop" }
# Cargo.lock keeps instability at 0.3.7 for the workspace's Rust 1.85 floor.
# Its published manifest: https://docs.rs/crate/instability/0.3.7/source/Cargo.toml
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
# The poll-based input backend returns on EOF; the default Mio backend can
# spin inside its read loop after a PTY closes, defeating even timed poll.
# https://docs.rs/crate/crossterm/0.28.1/source/src/event/source/unix/tty.rs
crossterm = { version = "0.28.1", features = ["use-dev-tty"] }
signal-hook = "0.3.18"
rustix = { version = "0.38.44", features = ["fs"] }
pulldown-cmark = { version = "=0.13.0", default-features = false }

[dev-dependencies]
tempfile = "3.10"
libc = "0.2"

[lints]
workspace = true

[package.metadata.release]
release = false
