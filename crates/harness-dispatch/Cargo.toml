[package]
name = "harness-dispatch"
version.workspace = true
edition.workspace = true
description = "Evaluate an owner's TypeScript harness-selection policy and dispatch the joint choice it makes"
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# **No Grove crate, by contract** (`docs/specs/harness-selection-and-execution.md`,
# *Package boundary*). Grove is one caller among many and supplies its kind,
# task and prompt as data; nothing here reads a task tree, a Grove filename or
# jj. The TypeScript worker, its SDK and the tasks that build them live under
# this directory too, so an extraction to its own repository moves one
# directory and a handful of Taskfile entries.
#
# `serde_json` without derive: every document this crate reads is validated
# field by field, so that a refusal can name the exact location it found, and a
# derived deserializer would report its own shape instead. `libc` places the
# protocol socket at descriptor 3 in the worker, which `std::process` has no
# interface for. `tempfile` is the worker's private empty directory.
#
# `rusqlite` with `bundled` is the run record store (*Records and later
# observations*): SQLite compiled into this binary, so no system library or
# database service takes part, and every target records with the same SQLite.
# Default features are off; `cache` would bring a prepared-statement cache the
# store's handful of statements has no use for. The bundled C is what makes the
# Linux cross-build (zigbuild at glibc 2.17) compile C, which
# `dispatch-delivery-k16` builds and smokes on every target. `sha2` digests the
# policy entry the record names; it was already a build dependency.
[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.10"

# The worker's source digest, computed without Bun: see build.rs.
[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
assert_cmd = "2.0"
tempfile = "3.10"

[lints]
workspace = true

# `cargo release` cuts *grove* (`crates/grove`) and nothing else. This package
# takes `version.workspace = true` and ships inside that cut, and its worker
# embeds the same version; `release = false` buys it no tag, changelog section
# or publish of its own (`docs/RELEASING.md`, *One release, eight packages, one
# tag*).
[package.metadata.release]
release = false
