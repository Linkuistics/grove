[[early-use]]
symbols   = "`Reading`, `Tree`, `Writing`, `TreeWrite`"
first-use = "01-orientation.md#the-imports"
owner     = "admitted-before-dispatch"
statement = "The two openings of a grove — a shared read and an exclusive write — each answering *vacant* as a value rather than an error."

[[early-use]]
symbols   = "`SessionEpochGuard`"
first-use = "01-orientation.md#the-imports"
owner     = "admitted-before-dispatch"
statement = "The guard `run` obtains when it admits this process against a live session epoch — present under a driver, absent for a manual command — alive through the verb, and consulted only by `complete`."

[[early-use]]
symbols   = "`Workspace`"
first-use = "01-orientation.md#the-imports"
owner     = "admitted-before-dispatch"
statement = "A resolved jj working tree; every verb but `complete` resolves it from the current directory, and the grove root is spelled from it in one place."

[[early-use]]
symbols   = "`Outcome`"
first-use = "01-orientation.md#the-imports"
owner     = "information-not-error"
statement = "Live, retired or abandoned — the infix a filename carries, rendered as a stderr note so a dead end never looks live."

[[early-use]]
symbols   = "`Reference`"
first-use = "01-orientation.md#the-imports"
owner     = "information-not-error"
statement = "A parsed spelling of a tree entry — key, handle or slug — read by its own type before any tree is opened."

[[early-use]]
symbols   = "`Sought`, `Resolution`"
first-use = "01-orientation.md#the-imports"
owner     = "information-not-error"
statement = "`Sought` is a found-or-nothing answer; `Resolution` is what `resolve` found — the root, one entry, or an ambiguity."

[[early-use]]
symbols   = "`Kind`, `Slug`"
first-use = "01-orientation.md#the-imports"
owner     = "before-the-lock"
statement = "The grammar's own types for a `--kind` token and a slug; malformed text is refused by them, before any lock."

[[early-use]]
symbols   = "`SessionConfig`"
first-use = "01-orientation.md#the-imports"
owner     = "before-the-lock"
statement = "The launch configuration, loaded whole and asked whether one kind resolves to a template."

[[early-use]]
symbols   = "`Handle`"
first-use = "01-orientation.md#the-imports"
owner     = "admit-before-signal"
statement = "A `<slug>-k<key>` handle, parsed leniently on the key and spoken canonically thereafter."

[[early-use]]
symbols   = "`Signalled`"
first-use = "01-orientation.md#the-imports"
owner     = "admit-before-signal"
statement = "Whether `complete` wrote the disposition to a channel or found no loop to signal."

[[early-use]]
symbols   = "`cmd_pick`, `cmd_brief_chain`, `cmd_kind`, `cmd_resolve`"
first-use = "02-the-grammar.md#worked-dispatch"
owner     = "information-not-error"
statement = "One handler per reading verb: the shared opening, one `grove_loop::verbs` call, and rendering."

[[early-use]]
symbols   = "`cmd_root_init`, `cmd_leaf_add`, `cmd_leaf_insert`, `cmd_leaf_decompose`"
first-use = "02-the-grammar.md#worked-dispatch"
owner     = "before-the-lock"
statement = "One handler per growing verb: text parsed, presence asked, then the exclusive opening, then one call."

[[early-use]]
symbols   = "`cmd_leaf_retire`, `cmd_leaf_prune`"
first-use = "02-the-grammar.md#worked-dispatch"
owner     = "two-steps-remain"
statement = "One handler per terminal mark: the exclusive opening, one call, the marked paths, and the two remaining steps on stderr."

[[early-use]]
symbols   = "`cmd_finish_commit`, `cmd_complete`"
first-use = "02-the-grammar.md#worked-dispatch"
owner     = "admit-before-signal"
statement = "The two handlers that open no tree: one commits through the workspace, one writes the completion channel."

