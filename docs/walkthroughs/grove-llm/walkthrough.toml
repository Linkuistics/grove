schema = 1

[book]
id      = "grove-llm"
title   = "grove-llm"
subject = "crates/grove-llm"

# The bare rule, with no exceptions at all: the crate's own manifest and every
# Rust file under `src/`. There is no `bin/`, no test-support module under
# `src/` and no inline `tests.rs` — `crates/grove-llm/tests/` is nine times the
# corpus and all of it is evidence — so this book carries no `[[corpus.add]]`
# and no `[[corpus.exclude]]`, and the normative inventory in
# `docs/specs/walkthrough-books.md` records that emptiness by giving the book
# no row.
[corpus]
include = [
  "crates/grove-llm/Cargo.toml",
  "crates/grove-llm/src/**/*.rs",
]

