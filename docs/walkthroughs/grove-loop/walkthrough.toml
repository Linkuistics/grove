schema = 1

[book]
id      = "grove-loop"
title   = "grove-loop"
subject = "crates/grove-loop"

# The bare rule, with one exception. Six roots carry a `#[cfg(test)] mod tests`,
# and five of those modules are inline — `tree_lifecycle.rs`, `task_tree.rs`,
# `task_name.rs`, `driver_lease.rs` and `loop_driver.rs` —
# and none of the five is excluded: a root is `src/**/*.rs`, so those lines are owned, reconstructed
# and explained like any other. The one exclusion is
# `src/task_grow/tests.rs`, whose file name is `tests.rs` and whose class the
# validator therefore checks rather than believes; it is the row
# `docs/specs/walkthrough-books.md`'s corpus exception inventory carries for this
# book, and declaring any other exclusion would disagree with that table.
# The sixth is `task_grow.rs`, whose two-line declaration names the external file
# excluded below. `crates/grove-loop/tests/` is evidence rather than corpus.
[corpus]
include = [
  "crates/grove-loop/Cargo.toml",
  "crates/grove-loop/src/**/*.rs",
]

[[corpus.exclude]]
path   = "crates/grove-loop/src/task_grow/tests.rs"
class  = "inline-test-module"
reason = "inline test module for task_grow: 1,784 lines of evidence, cited by name in chapter 10 and not reproduced"

