[[early-use]]
symbols   = "`TaskName`, `TaskNameError`, `Verdict`, `verdict`, `entry`, `malformed`"
first-use = "02-the-tokens.md#the-four-verdicts"
owner     = "canonical-or-nothing"
statement = "The parsed name, its refusal type, the classification a caller reads, and the three test helpers that reach a verdict: the only way to a verdict is through the `EntryName` implementation chapter 4 owns."

[[early-use]]
symbols   = "`impl Display for TaskName`"
first-use = "02-the-tokens.md#refusals-inside-the-shape"
owner     = "canonical-or-nothing"
statement = "The renderer that writes a parsed name back to its filename bytes. Leaves reuse handle rendering; directories share its key-suffix renderer; node files carry no key. The round-trip test pins each of two names to its own bytes, so the reader needs the rendering direction here."

[[early-use]]
symbols   = "`TaskName::compose`"
first-use = "03-kind-slug-handle.md#the-handle-is-the-identity"
owner     = "canonical-or-nothing"
statement = "Composition builds a positioned name from a position, a kind, a slug and a key, so the handle's structural claim can be asserted over names built rather than parsed."

[[early-use]]
symbols   = "`entry_path`"
first-use = "05-opening.md#one-spelling-of-the-root"
owner     = "paths-are-built-here"
statement = "The one place an entry's absolute path is built, because the store returns no paths. Chapter 5 reproduces the module header that says so; chapter 6 reads the function."

