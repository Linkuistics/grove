[[early-use]]
symbols   = "`Workspace`"
first-use = "01-orientation.md#public-surface"
owner     = "one-lane"
statement = "A resolved workspace is a value whose existence is the proof that the precondition passed; it carries the workspace root and the root of the workspace that holds the repository."

[[early-use]]
symbols   = "`Refusal`"
first-use = "01-orientation.md#public-surface"
owner     = "no-remedy-of-its-own"
statement = "The one error type: an opaque value carrying what is wrong, where, and the jj command that fixes it, with no matchable variants because every case is a stop."

[[early-use]]
symbols   = "`control_dir`"
first-use = "01-orientation.md#public-surface"
owner     = "no-consumer-vocabulary"
statement = "A namespace is one plain directory name the consumer supplies; the directory it names is inside the workspace, untracked, never shared, and created if absent."

[[early-use]]
symbols   = "`Commit`"
first-use = "01-orientation.md#public-surface"
owner     = "no-transactions"
statement = "What a taken commit returns: a change id rather than a commit id, because a change id still names the work after a rewrite."

[[early-use]]
symbols   = "`main_repo_of`"
first-use = "01-orientation.md#commit-tour"
owner     = "one-lane"
statement = "The step in resolution that decides which workspace holds the repository: `.jj/repo` is a directory in a workspace that holds its own and a pointer file in one that borrows another's, and only the borrowed case is followed."

[[early-use]]
symbols   = "`is_tracked`"
first-use = "01-orientation.md#the-six-refusals"
owner     = "no-transactions"
statement = "The one probe whose answer depends on the working copy, and so the one that lets jj snapshot before answering."

[[early-use]]
symbols   = "`jj::output`, `jj::produced_output`"
first-use = "02-the-gate.md#worked-resolution"
owner     = "nothing-ambient"
statement = "Every jj invocation the crate makes is built at one seam that fixes the working directory, removes the repository selectors, and separates failure to start from failure to succeed."

[[early-use]]
symbols   = "`Refusal::not_a_workspace`, `Refusal::unresolvable_path`"
first-use = "02-the-gate.md#worked-resolution"
owner     = "no-remedy-of-its-own"
statement = "Refusal constructors are crate-internal; the gate's refusal names jj's two initialisation commands and states that nothing was created or changed."

