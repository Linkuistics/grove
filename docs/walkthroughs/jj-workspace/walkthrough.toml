schema = 1

[book]
id      = "jj-workspace"
title   = "jj-workspace"
subject = "crates/jj-workspace"

# The bare rule, with no exceptions at all: the crate's own manifest and every
# Rust file under `src/`. There is no `bin/`, no test-support module and no
# inline `tests.rs`, so this book carries no `[[corpus.add]]` and no
# `[[corpus.exclude]]` — and the normative inventory in
# `docs/specs/walkthrough-books.md` records that emptiness rather than omitting
# the book.
[corpus]
include = [
  "crates/jj-workspace/Cargo.toml",
  "crates/jj-workspace/src/**/*.rs",
]

