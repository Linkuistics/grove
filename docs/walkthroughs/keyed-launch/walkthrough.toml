id      = "keyed-launch"
title   = "keyed-launch"
subject = "crates/keyed-launch"

# The bare rule, with no exceptions at all: the crate's own manifest and every
# Rust file under `src/`. `src/channel.rs` lines 272-404 are an inline
# `#[cfg(test)] mod tests`, and they are **not** excluded — a root is
# `src/**/*.rs`, the exception class `inline-test-module` is checked against a
# file named `tests.rs`, and those 133 lines are owned, reconstructed and
# explained by chapter 9 like any other. `crates/keyed-launch/tests/`
# is evidence rather than corpus, so this book carries no
# `[[corpus.add]]` and no `[[corpus.exclude]]`, and the normative inventory in
# `docs/specs/walkthrough-books.md` records that emptiness by giving the book no
# row.
[corpus]
include = [
  "crates/keyed-launch/Cargo.toml",
  "crates/keyed-launch/src/**/*.rs",
]

