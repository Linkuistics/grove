[[early-use]]
symbols   = "`Channel`, `Token`, `signal`"
first-use = "01-orientation.md#the-cast"
owner     = "appearance-is-the-event"
statement = "A fresh path per launch that allocation picks and writes nothing to; `signal` is what the child calls to make it appear, and `Token` is what the caller reads back."

[[early-use]]
symbols   = "`run`, `run_observed`, `LaunchEvent`, `Launch`, `EntrySignals`, `Ended`, `End`, `Group`, `Escalation`"
first-use = "01-orientation.md#the-cast"
owner     = "nothing-else-added"
statement = "`run_observed` reports successful spawn and confirmed reap synchronously; `run` uses a no-op observer. Each spawns one `Launch` — argv, channel, scrub list, granted values, a transparent caller's `EntrySignals` when there is one, working directory and the two graces of an `Escalation` — and returns an `Ended` saying which of `End`'s three cases happened, whether the channel appeared, and whether the child's `Group` was confirmed gone."

[[early-use]]
symbols   = "`reraise`, `take_interrupt`"
first-use = "01-orientation.md#the-cast"
owner     = "the-launchers-job"
statement = "The launcher's own two obligations for a termination signal: `take_interrupt` collects one that arrived between launches, and `reraise` is how a launcher dies of the same signal rather than reporting an exit code."

[[early-use]]
symbols   = "`run_noninteractive`, `run_confined`, `Confinement`, `regular_file_at`"
first-use = "01-orientation.md#the-cast"
owner     = "confined-jobs"
statement = "A launch with no terminal whose output goes to a file, the same launch under a mandatory filesystem policy, that policy's two fields, and the one read of a result that policy leaves safe."

[[early-use]]
symbols   = "`install_termination_handler`, `restore_child_watching`, `INTERRUPTED_BY`, `Mode`, `supervise`"
first-use = "03-the-job.md#the-spawn"
owner     = "the-launchers-job"
statement = "`run`'s first and last acts: the handler that latches a cancelling signal the launcher does not ignore into the process-global `INTERRUPTED_BY`, cleared immediately before each spawn; the repair for an inherited ignored SIGCHLD; and the supervisor that, told the launch's `Mode`, watches the child, ends its group and gives the terminal back."

