[[early-use]]
symbols   = "`Vocabulary`, `SlotRule`, `Requirement`"
first-use = "01-orientation.md#the-cast"
owner     = "rules-about-names"
statement = "The slot names a consumer's templates are written against, each with a cardinality; supplied at load, because every template rule is a rule about a slot's name."

[[early-use]]
symbols   = "`Templates`"
first-use = "01-orientation.md#the-cast"
owner     = "rules-about-names"
statement = "One loaded configuration: key to complete command template, compiled against a vocabulary and validated whole before anything is spawned."

[[early-use]]
symbols   = "`Argv`, `Slot`"
first-use = "01-orientation.md#the-cast"
owner     = "whole-word-or-nothing"
statement = "`Argv` is a program and its arguments with no public constructor, authored only by `Templates::expand`; `Slot` is one name-and-value a caller offers to that call."

[[early-use]]
symbols   = "`Channel`, `Token`, `signal`"
first-use = "01-orientation.md#the-cast"
owner     = "appearance-is-the-event"
statement = "A fresh path per launch that allocation picks and writes nothing to; `signal` is what the child calls to make it appear, and `Token` is what the caller reads back."

[[early-use]]
symbols   = "`run`, `run_observed`, `LaunchEvent`, `Launch`, `Ended`, `End`, `Escalation`"
first-use = "01-orientation.md#the-cast"
owner     = "nothing-else-added"
statement = "`run_observed` reports successful spawn and confirmed reap synchronously; `run` uses a no-op observer. Each spawns one `Launch` — argv, channel, scrub list, working directory and the two graces of an `Escalation` — and returns an `Ended` saying which of `End`'s three cases happened."

[[early-use]]
symbols   = "`reraise`, `take_interrupt`"
first-use = "01-orientation.md#the-cast"
owner     = "the-launchers-job"
statement = "The launcher's own two obligations for a termination signal: `take_interrupt` collects one that arrived between launches, and `reraise` is how a launcher dies of the same signal rather than reporting an exit code."

[[early-use]]
symbols   = "`conformance::check`"
first-use = "01-orientation.md#the-cast"
owner     = "checked-without-meaning"
statement = "The kit that holds a consumer's configuration to this crate's contract from outside the consumer's own suite."

[[early-use]]
symbols   = "`validate_node`, `validate_template`"
first-use = "03-two-documents.md#both-documents"
owner     = "words-not-shell"
statement = "The per-node and per-template rule checks `validate_document` drives over both documents; each returns diagnostics with locations rather than stopping at the first."

[[early-use]]
symbols   = "`install_termination_handler`, `INTERRUPTED_BY`, `supervise`"
first-use = "07-the-job.md#the-spawn"
owner     = "the-launchers-job"
statement = "`run`'s first and last acts: the handler that latches the launcher's own SIGTERM or SIGHUP into the process-global `INTERRUPTED_BY`, cleared immediately before each spawn, and the supervisor that watches the child and takes the terminal back."

