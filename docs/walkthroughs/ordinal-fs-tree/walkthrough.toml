[[early-use]]
symbols   = "`Ordinal`, `Key`, `Found`, `Verdict`, `Species`, `EntryName`"
first-use = "01-orientation.md#working-vocabulary"
owner     = "name-seam-k12"
statement = "Ordinal is mutable sibling position, key is stable tree identity, observed file kind is not followed, verdict separates foreign, accepted, and refused names, species controls file versus directory shape, and EntryName is the consumer parsing and composition seam."

[[early-use]]
symbols   = "`manifest-cli-binary`"
first-use = "01-orientation.md#package-contract"
owner     = "syllabus-cli-k17"
statement = "The binary declaration is CLI-owned and deferred; it maps the demonstration executable to its external consumer source and requires the CLI feature."

[[early-use]]
symbols   = "`manifest-cli-feature`"
first-use = "01-orientation.md#package-contract"
owner     = "syllabus-cli-k17"
statement = "The optional parser dependency is activated by a later CLI-owned feature range, enabled by default while library consumers may disable default features."

[[early-use]]
symbols   = "`Sought`"
first-use = "01-orientation.md#public-surface"
owner     = "name-seam-k12"
statement = "Sought distinguishes a search match from a completed search that matched nothing; nothing is neither a mutation refusal nor an error, while accessors retain Option."

[[early-use]]
symbols   = "`Label`, `Status`, `reference::Parts`, `SyllabusName`"
first-use = "01-orientation.md#insert-tour"
owner     = "reference-domain-k13"
statement = "These values are the syllabus consumer's vocabulary and seam implementation, not library defaults."

[[early-use]]
symbols   = "`Snapshot`, `Entry`, `ReadGuard`"
first-use = "01-orientation.md#insert-tour"
owner     = "read-path-k14"
statement = "A snapshot is the immutable parsed tree captured under a guard, entries are borrowed views, and a read guard couples a shared lock, caller-spelled root, and snapshot."

[[early-use]]
symbols   = "`Target`, `NewEntry`, `Decision`, `Refusal`, `Plan`, `Effect`, `Report`"
first-use = "01-orientation.md#insert-tour"
owner     = "mutation-algebra-k15"
statement = "Target names the root or a stable key, new entry carries opaque parts and bytes that may be empty, every input yields refusal or a guarded ordered plan, and the report records landed effects in its documented orders."

[[early-use]]
symbols   = "`WriteGuard`, `Error`, `apply::Faults`, `apply::Run`"
first-use = "01-orientation.md#insert-tour"
owner     = "filesystem-interpreter-k16"
statement = "A write guard couples an exclusive lock and snapshot and is consumed by one mutation, errors distinguish refusal, clean rollback, partial rollback, and boundary failure, Faults is a test seam, and Run owns per-plan forward and undo state."

[[early-use]]
symbols   = "`Cli`, `Verb`, `Streams`, `Failure`"
first-use = "01-orientation.md#insert-tour"
owner     = "syllabus-cli-k17"
statement = "Parsed verbs drive dispatch, stdout is result data, stderr carries advisories and errors, and failure pairs operator-facing text with an exit category."

[guide]
omitted = "ordinal-fs-tree is a bounded context of its own (CONTEXT-MAP.md); its walkthrough is self-contained and its reader need not have driven a grove."
