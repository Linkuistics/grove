schema = 1

[book]
id      = "overview"
title   = "System overview"
subject = "crates/grove"

# The bare rule, with no exceptions at all: the crate's own manifest and every
# Rust file under `src/`. `cli.rs` ends in a `#[cfg(test)] mod tests`, and that
# module is inside a root and is reconstructed — the `inline-test-module`
# exclusion class applies to a whole file named `tests.rs`, which this is not —
# so this book carries no `[[corpus.add]]` and no `[[corpus.exclude]]`, and the
# normative inventory in `docs/specs/walkthrough-books.md` records that
# emptiness by giving the book no row.
[corpus]
include = [
  "crates/grove/Cargo.toml",
  "crates/grove/src/**/*.rs",
]

