# herdr-plugin.toml — the grove task-tree viewer.
#
# UI only, by design. Semantic pane state (`idle` / `working` / `blocked`) is reported
# by the `grove` binary over herdr's socket and is none of this plugin's business:
# herdr's full lifecycle authority is a compiled-in allowlist that nothing outside the
# binary can join, and a plugin has exactly the socket access `grove-llm` already has.
# This half of the split renders the artifacts — see grove's ADR *herdr-optional-ui*.
#
# The only contract is grove's published `.grove/` directory scheme (ADR
# *task-tree-scheme*). Nothing here calls `grove` or `grove-llm`, so the plugin and the
# binary version independently and neither can break the other.
#
# Requires `python3` on PATH — verified against macOS's own 3.9.6 and 3.14. No
# third-party packages, so there is no [[build]] step and `herdr plugin link` works
# as-is. macOS and Linux only: the renderer drives a raw terminal through `termios`.

id = "linkuistics.grove"
name = "grove"
version = "0.1.0"
description = "Render a grove task tree (.grove/) — which leaf is running, its kind, what is left."
min_herdr_version = "0.7.0"
platforms = ["linux", "macos"]

# The viewer. Its cwd is the plugin's own directory, which says nothing about which
# grove the human is looking at, so it takes the invoking pane's cwd from
# HERDR_PLUGIN_CONTEXT_JSON and walks up from there for `.grove/`.
#
# Do NOT open this with `plugin pane open --cwd`: that REPLACES the plugin root as the
# process cwd, and herdr then resolves the relative command below against the new cwd
# and fails to spawn. `--cwd` buys nothing here anyway — the context JSON already
# carries the invoking pane's cwd, on both the split and the overlay path.
[[panes]]
id = "tree"
title = "grove"
placement = "split"
command = ["python3", "grove_tree.py"]

# A keybinding can only target a plugin *action*, never a pane entrypoint, so these
# exist to summon the pane. Bind one in ~/.config/herdr/config.toml:
#   [[keys.command]]
#   key = "prefix+t"
#   type = "plugin_action"
#   command = "linkuistics.grove.open-tree"
[[actions]]
id = "open-tree"
title = "grove tree"
description = "Open the grove task tree in a split beside this pane."
contexts = ["pane"]
command = [
  "sh",
  "-c",
  '''exec "${HERDR_BIN_PATH:-herdr}" plugin pane open --plugin linkuistics.grove --entrypoint tree --placement split --focus''',
]

[[actions]]
id = "open-tree-overlay"
title = "grove tree (overlay)"
description = "Glance at the grove task tree in a zoomed overlay over this pane."
contexts = ["pane"]
command = [
  "sh",
  "-c",
  '''exec "${HERDR_BIN_PATH:-herdr}" plugin pane open --plugin linkuistics.grove --entrypoint tree --placement overlay --focus''',
]
