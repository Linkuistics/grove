# cargo-release configuration.
#
# Usage:
#   cargo install cargo-release           # one-time
#   cargo release patch --execute         # 1.0.0 → 1.0.1 + tag v1.0.1
#   cargo release minor --execute         # 1.0.0 → 1.1.0 + tag v1.1.0
#   cargo release major --execute         # 1.0.0 → 2.0.0 + tag v2.0.0
#
# Omit `--execute` for a dry run. Run it from the colocated workspace
# (`jj workspace root --name default`), not from a jj-native secondary
# workspace — cargo-release drives git, and only the colocated one has a
# `.git`.
#
# FIRST, in that colocated workspace:
#   jj new main
# cargo-release commits against git `HEAD`, and a colocated `HEAD` follows the
# working copy's parent — so without this the release commit lands on whatever
# the workspace was last parked on. It also fast-forwards `refs/heads/main` as
# a side effect of jj's automatic export, which is the only thing that closes
# the lag `jj bookmark list --all-remotes` reports as `@git (behind by N)`.
# That lag is normal here: commits made from a jj-native secondary workspace
# have no `.git` to export to, so they accumulate until a colocated command
# runs.
#
# BEFORE the cut: rename `CHANGELOG.md`'s `## Unreleased` heading to the version
# being released. Sessions log their changes under that heading as they make them
# (the file's own preamble has the reasoning), and there are no
# `pre-release-replacements` below — so nothing renames it but you, and a cut that
# forgets leaves the release's entries filed under "Unreleased" above its own
# empty version heading.
#
# Push is not automated; after release:
#   jj bookmark set main -r <release-change>
#   jj git push -b main                     # bookmark: jj drives the mutation
#   git push origin v<version>              # tag: jj refuses to push tags,
#                                           # the standing symmetric-vcs-rule
#                                           # exception. Do not skip it — the
#                                           # GitHub Release is cut against it.
#
# Two things worth knowing before an agent-driven cut.
#
# The scripted forms of both outward-facing gestures get refused as opaque
# invocations by the harness's own command classifier — `cargo release …
# --execute` here, and `scripts/release-publish.sh` at the end. Their
# constituent commands (`gh release create`, the tap `cp`/`commit`/`push`) run
# fine spelled out, so expect to hand the cut to the human and to run the
# publish step by hand. Nothing about the scripts needs changing.
#
# Installing the new build mid-session is safe, and the proofs belong in the
# same session as the install. The driver's version-skew guard is the first
# thing in the loop *body* (`src/loop_driver.rs`), so it fires between
# iterations: a `brew upgrade` under a live `grove do` lets the session that
# ran it finish normally and stops the loop before the next one. A shipping
# task therefore does not have to defer its installed-binary checks to a
# follow-up — see `scripts/release-publish.sh` for the rig.

# Not a crates.io crate — `cargo release` must skip `cargo publish`.
publish = false

# Leave the push to the operator so the release commit + tag can be
# inspected locally before any remote side-effect.
push = false

# Admit a detached HEAD. This repo is jj-colocated, and a detached git HEAD is
# jj's normal resting state, not a broken checkout — so cargo-release's default
# `["*", "!HEAD"]` refuses every release cut from here:
#
#   error: cannot release from branch `HEAD` as it doesn't match `*`, `!HEAD`
#
# Dropping the negation is what matters (`["*"]` alone also works); `HEAD` is
# listed explicitly so a reader sees it admitted on purpose rather than lost.
# The result is clean: git makes the detached release commit and tag, jj imports
# it, and `jj bookmark set main -r <release-change>` moves the bookmark onto it.
allow-branch = ["*", "HEAD"]

# Tag shape `v1.0.0` matches what `git describe` emits and what the
# --version output renders.
tag-name = "v{{version}}"
tag-message = "Release v{{version}}"

# Single consistent commit message shape across releases.
pre-release-commit-message = "chore: release v{{version}}"

# Give each released crate its own commit instead of one consolidated workspace
# commit. This is what makes `{{version}}` render in the message above: in a
# *consolidated* commit (cargo-release's default for a workspace) `{{version}}`
# is ambiguous across members and is left unrendered — producing a literal
# "chore: release v{{version}}". grove only ever releases the one `grove` crate
# (`harness-pane` is `release = false`), so a per-crate commit is a single,
# correctly-rendered commit. (The tag templates above always rendered because
# tagging is per-crate.)
consolidate-commits = false
