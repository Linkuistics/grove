# cargo-release configuration.
#
# Usage:
#   cargo install cargo-release           # one-time
#   cargo release patch --execute         # 1.0.0 → 1.0.1 + tag v1.0.1
#   cargo release minor --execute         # 1.0.0 → 1.1.0 + tag v1.1.0
#   cargo release major --execute         # 1.0.0 → 2.0.0 + tag v2.0.0
#
# Omit `--execute` for a dry run. Run it from the colocated workspace
# (`jj workspace root --name default`), not from a jj-native secondary
# workspace — cargo-release drives git, and only the colocated one has a
# `.git`.
#
# FIRST, in that colocated workspace:
#   jj new main
# cargo-release commits against git `HEAD`, and a colocated `HEAD` follows the
# working copy's parent — so without this the release commit lands on whatever
# the workspace was last parked on. It also fast-forwards `refs/heads/main` as
# a side effect of jj's automatic export, which is the only thing that closes
# the lag `jj bookmark list --all-remotes` reports as `@git (behind by N)`.
# That lag is normal here: commits made from a jj-native secondary workspace
# have no `.git` to export to, so they accumulate until a colocated command
# runs.
#
# The `CHANGELOG.md` heading rename is automated — see `pre-release-replacements`
# at the foot of this file. Nothing to do by hand, and nothing to remember: the
# cut renames `## Unreleased` to the version and puts a fresh empty one back.
# A missing standing heading aborts the cut before any write, so the failure is
# loud rather than a release filed under "Unreleased".
#
# Push is not automated; after release:
#   jj bookmark set main -r <release-change>
#   jj git push -b main                     # bookmark: jj drives the mutation
#   git push origin v<version>              # tag: jj refuses to push tags,
#                                           # the standing symmetric-vcs-rule
#                                           # exception. Do not skip it — the
#                                           # GitHub Release is cut against it.
#
# Two things worth knowing before an agent-driven cut.
#
# The scripted forms of both outward-facing gestures — `cargo release …
# --execute` here, and `scripts/release-publish.sh` at the end — were recorded
# as refused by the harness's own command classifier, so the expectation was to
# hand the cut to the human and run the publish by hand. **Measured against the
# real target on 2026-07-31 and both ran permitted**: one agent-driven cut took
# v16.2.0 → v16.3.0, tagged, pushed bookmark and tag, built all three targets
# and published the GitHub Release and the tap, with neither script refused.
#
# So do not plan around a refusal — but do not invert the claim either. What was
# settled is that refusal is not *inherent* to these invocations; the classifier
# reads the session's own harness and permission configuration, which the repo
# cannot see from here. Treat it as a per-session fact: run the script, and fall
# back to spelling out its constituent commands (`gh release create`, the tap
# `cp`/`commit`/`push`) only if that session's classifier actually refuses.
# Either way nothing about the scripts needs changing.
#
# (The earlier note said a permitted run in a throwaway fixture was no evidence,
# because a scratch repo is a different target from the real cut, and left it to
# "whoever next runs a real cut" to settle. This is that cut.)
#
# Installing the new build mid-session is safe, and the proofs belong in the
# same session as the install. The driver's version-skew guard is the first
# thing in the loop *body* (`src/loop_driver.rs`), so it fires between
# iterations: a `brew upgrade` under a live `grove do` lets the session that
# ran it finish normally and stops the loop before the next one. A shipping
# task therefore does not have to defer its installed-binary checks to a
# follow-up — see `scripts/release-publish.sh` for the rig.

# Not a crates.io crate — `cargo release` must skip `cargo publish`.
publish = false

# Leave the push to the operator so the release commit + tag can be
# inspected locally before any remote side-effect.
push = false

# Admit a detached HEAD. This repo is jj-colocated, and a detached git HEAD is
# jj's normal resting state, not a broken checkout — so cargo-release's default
# `["*", "!HEAD"]` refuses every release cut from here:
#
#   error: cannot release from branch `HEAD` as it doesn't match `*`, `!HEAD`
#
# Dropping the negation is what matters (`["*"]` alone also works); `HEAD` is
# listed explicitly so a reader sees it admitted on purpose rather than lost.
# The result is clean: git makes the detached release commit and tag, jj imports
# it, and `jj bookmark set main -r <release-change>` moves the bookmark onto it.
allow-branch = ["*", "HEAD"]

# Tag shape `v1.0.0` matches what `git describe` emits and what the
# --version output renders.
tag-name = "v{{version}}"
tag-message = "Release v{{version}}"

# Single consistent commit message shape across releases.
pre-release-commit-message = "chore: release v{{version}}"

# Give each released crate its own commit instead of one consolidated workspace
# commit. This is what makes `{{version}}` render in the message above: in a
# *consolidated* commit (cargo-release's default for a workspace) `{{version}}`
# is ambiguous across members and is left unrendered — producing a literal
# "chore: release v{{version}}". grove only ever releases the one `grove` crate,
# so a per-crate commit is a single, correctly-rendered commit. (The tag templates
# above always rendered because tagging is per-crate.)
#
# What makes it one crate is **cargo-release's default crate selection**, not any
# per-member opt-out: invoked at a workspace root that is itself a package,
# `cargo release` operates on that package alone, and the `codex-bridge` member is
# reached only by `--workspace` or `-p`. That member carries `publish = false` but
# **no** `[package.metadata.release] release = false` — so do not read the single
# crate as a property of the workspace. It is a property of the documented
# invocation at the top of this file. (An earlier version of this comment credited
# a `release = false` on a `harness-pane` member; there is no such crate, and the
# opt-out never existed.)
consolidate-commits = false

# Close `CHANGELOG.md`'s standing `## Unreleased` heading as part of the cut, and
# re-seed an empty one. Sessions log their changes under that heading as they make
# them (the file's own preamble has the reasoning), which only works if something
# renames it at release time — and a manual step in a comment is defeated by
# forgetting it, in the one file whose whole value is an accurate record of what
# changed and when.
#
# One replacement does both halves. The match does not consume the surrounding
# blank lines, so writing the heading back *plus* the version heading below it
# leaves the accumulated entries exactly where they are, now under the version:
#
#   ## Unreleased            ## Unreleased
#                     ──▶
#   ### Added                ## v16.3.0
#   - a thing
#                            ### Added
#                            - a thing
#
# Three things about this were checked against cargo-release 1.1.2 in a throwaway
# workspace fixture rather than assumed, because each one has a silent failure mode:
#
# `search` is a **regex**, compiled with multiline mode on — which is what makes
# `^## Unreleased$` viable and is the whole reason this is safe. The string
# `## Unreleased` occurs many times in `CHANGELOG.md`, in the preamble's own prose
# *about* this convention and in the entry describing this change; only the heading
# is ever a whole line. An unanchored search matches every one of them, and the
# count rises each time someone documents the convention — so do not "simplify" the
# anchors away, and do not replace them with a match count.
#
# `exactly = 1` is a guard, not decoration. It turns every way this can go wrong
# into an abort before any write: the unanchored search above fails with "at most 1
# replacements expected, found 3", and a releaser who already renamed the heading by
# hand — or deleted the standing one — fails the same way instead of shipping a
# release whose entries are filed under the wrong heading.
#
# It cannot double-apply. Replacements run once **per released crate** (regardless
# of `consolidate-commits`, which affects only how the commits are grouped), and
# `file` resolves against each released crate's *own* manifest directory — so the
# root `CHANGELOG.md` is only ever reached by the root crate. Should someone cut
# with `--workspace`, `codex-bridge` has no `CHANGELOG.md` and the run aborts
# ("unable to find file .../codex-bridge/CHANGELOG.md to perform replace") rather
# than renaming anything twice.
#
# Robust to an empty `## Unreleased` — a release of work already filed under a
# version yields an empty `## v<next>` between the standing heading and the previous
# release, which is correct and, more to the point, does not lose the standing
# heading. The anchor is the heading, never the content beneath it.
#
# Verify a change here with a plain `cargo release patch` (no `--execute`): the dry
# run prints a unified diff of every replacement, so the rewrite is observable
# without cutting anything. The stronger check does not need this repo at all — a
# throwaway two-member workspace with a copy of this file and of `CHANGELOG.md`
# reproduces the whole thing, including the `--workspace` and empty-section cases,
# and is how the claims above were established.
pre-release-replacements = [
  { file = "CHANGELOG.md", search = "^## Unreleased$", replace = "## Unreleased\n\n## v{{version}}", exactly = 1 },
]
